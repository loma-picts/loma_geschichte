    let cachedVoice = null;

    function pickGermanVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      return (
        voices.find(v => v.lang.toLowerCase().startsWith("de-ch")) ||
        voices.find(v => v.lang.toLowerCase().startsWith("de")) ||
        null
      );
    }

    if ("speechSynthesis" in window) {
      cachedVoice = pickGermanVoice();
      window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickGermanVoice(); };
    }

    function clearSpeechUI() {
      document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
      if (activeSpeakBtn) {
        activeSpeakBtn.classList.remove("speaking-active");
        if (activeSpeakBtn.dataset.origLabel) activeSpeakBtn.textContent = activeSpeakBtn.dataset.origLabel;
      }
      activeSpeakBtn = null;
      const gb = document.getElementById("global-speak-btn");
      const gl = document.getElementById("speak-label");
      if (gb) gb.classList.remove("speaking-active");
      if (gl) gl.textContent = "Vorlesen";
    }

    function stopSpeech() {
      readingSequenceCancelled = true;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      clearSpeechUI();
    }

    function speakText(text, btnEl = null, highlightEl = null) {
      if (!("speechSynthesis" in window)) {
        alert("Dein Browser unterstützt leider keine Sprachausgabe.");
        return;
      }
      const isSameBtn = btnEl && activeSpeakBtn === btnEl && window.speechSynthesis.speaking;
      stopSpeech();
      if (isSameBtn) return;

      readingSequenceCancelled = false;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "de-CH";
      utter.rate = 0.92;
      if (cachedVoice) utter.voice = cachedVoice;

      if (highlightEl) highlightEl.classList.add("speaking");
      if (btnEl) {
        btnEl.dataset.origLabel = btnEl.textContent.trim();
        btnEl.classList.add("speaking-active");
        btnEl.textContent = "⏹ Stopp";
        activeSpeakBtn = btnEl;
      }

      utter.onend = clearSpeechUI;
      utter.onerror = clearSpeechUI;
      window.speechSynthesis.speak(utter);
    }

    function speakFromBtn(btnEl) {
      speakText(btnEl.dataset.speech || "", btnEl);
    }

    function speakPanel(chId, panelIdx, btnEl) {
      const ch = CHAPTER_STORY[chId];
      if (!ch || !ch.panels[panelIdx]) return;
      const box = document.getElementById(`panel-${panelIdx}`);
      speakText(stripTokensForSpeech(ch.panels[panelIdx].text), btnEl, box);
    }

    function readChapterInfo(chId, btnEl) {
      const html = CHAPTER_STORY[chId]?.infoText || "";
      const tmp = document.createElement("div");
      tmp.innerHTML = html.replace(/<br\s*\/?>/gi, ". ");
      speakText(tmp.textContent || "", btnEl);
    }

    function speakCurrentSection() {
      if (!("speechSynthesis" in window)) {
        alert("Dein Browser unterstützt leider keine Sprachausgabe.");
        return;
      }
      const globalBtn = document.getElementById("global-speak-btn");
      const globalLabel = document.getElementById("speak-label");
      if (window.speechSynthesis.speaking && !readingSequenceCancelled && globalBtn.classList.contains("speaking-active")) {
        stopSpeech();
        return;
      }
      stopSpeech();

      if (state.currentStep === 0) {
        speakText("Willkommen zum Thema Kolonien, Dreieckshandel und Sklaverei. Du kannst alle acht Kapitel frei auswählen und direkt auf der Website bearbeiten.");
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      if (state.currentStep === 9) {
        const done = getCompletedCount();
        speakText(`Dein Lernpass. Du hast bisher ${done} von 8 Kapiteln gelöst. Hier kannst du dein Potosí-Tagebuch kopieren oder als Bild speichern.`);
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      const ch = CHAPTER_STORY[state.currentStep];
      if (!ch) return;

      readingSequenceCancelled = false;
      globalBtn.classList.add("speaking-active");
      globalLabel.textContent = "Stopp";

      let idx = 0;
      function nextPanel() {
        if (readingSequenceCancelled || idx >= ch.panels.length) {
          clearSpeechUI();
          return;
        }
        const panel = ch.panels[idx];
        const box = document.getElementById(`panel-${idx}`);
        document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
        if (box) box.classList.add("speaking");

        const utter = new SpeechSynthesisUtterance(stripTokensForSpeech(panel.text));
        utter.lang = "de-CH";
        utter.rate = 0.92;
        if (cachedVoice) utter.voice = cachedVoice;

        utter.onend = () => { idx++; nextPanel(); };
        utter.onerror = clearSpeechUI;
        window.speechSynthesis.speak(utter);
      }
      nextPanel();
    }

    // =========================================================================
    // 22. HAUPT-RENDER
    // =========================================================================
    function render() {
      renderHeaderStats();
      renderStepper();
      const main = document.getElementById("app-main");
      const step = state.currentStep;

      if (step === 0) main.innerHTML = renderOverview();
      else if (step === 1) main.innerHTML = renderStep1();
      else if (step === 2) main.innerHTML = renderStep2();
      else if (step === 3) main.innerHTML = renderStep3();
      else if (step === 4) main.innerHTML = renderStep4();
      else if (step === 5) main.innerHTML = renderStep5();
      else if (step === 6) main.innerHTML = renderStep6();
      else if (step === 7) main.innerHTML = renderStep7();
      else if (step === 8) main.innerHTML = renderStep8();
      else main.innerHTML = renderLernpass();
    }

    loadState();
    render();
  </script>
</body>
</html>
