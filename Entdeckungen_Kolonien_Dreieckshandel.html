<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entdeckungen: Kolonien, Dreieckshandel &amp; Sklaverei – Comic-Abenteuer</title>
  <style>
    :root {
      --ocean-deep: #15324D;
      --ocean-mid: #1F4E78;
      --ocean-light: #D9EEF8;
      --parchment: #FBF4E4;
      --parchment-card: #FFFDF8;
      --parchment-dark: #EADBC0;
      --gold: #D49B35;
      --gold-bright: #F4C552;
      --gold-soft: #FDF1CE;
      --spice-red: #B8402C;
      --spice-soft: #FDECE8;
      --emerald: #237A4B;
      --emerald-soft: #E2F5EA;
      --ink: #221A14;
      --ink-muted: #5C4E42;
      --border-comic: #2A2018;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 56px 0;
      background-color: var(--parchment);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(212, 155, 53, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, rgba(31, 78, 120, 0.10) 0%, transparent 50%);
      color: var(--ink);
      font-family: Verdana, 'Trebuchet MS', system-ui, -apple-system, sans-serif;
      font-size: calc(17.5px * var(--font-scale));
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-title {
      font-family: 'Trebuchet MS', Verdana, system-ui, sans-serif;
      letter-spacing: 0.01em;
    }

    /* ================= TOP HEADER ================= */
    .top-header {
      background: linear-gradient(135deg, var(--ocean-deep) 0%, var(--ocean-mid) 100%);
      color: #FFFDF8;
      border-bottom: 4px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 4px 16px rgba(21, 50, 77, 0.22);
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--gold-bright);
      color: var(--ink);
      border: 2.5px solid var(--border-comic);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 2px 2px 0 var(--border-comic);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--gold-soft);
      opacity: 0.95;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-link-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFDF8;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 40px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }

    .header-link-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .pill-stat {
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid var(--gold-bright);
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 40px;
      font-size: 0.84rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= PROGRESS STEPPER ================= */
    .stepper-bar {
      background: var(--parchment-dark);
      border-top: 1px solid rgba(42, 32, 24, 0.15);
    }

    .stepper-scroll {
      max-width: 1020px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .step-chip {
      border: 2px solid var(--border-comic);
      background: var(--parchment-card);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.12s ease, background-color 0.15s ease;
      font-family: inherit;
      min-height: 40px;
      touch-action: manipulation;
    }

    .step-chip:hover {
      transform: translateY(-1px);
      background: var(--gold-soft);
    }

    .step-chip.active {
      background: var(--gold-bright);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--border-comic);
    }

    .step-chip.done {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #164F30;
    }

    /* ================= MAIN LAYOUT ================= */
    .main-wrap {
      max-width: 980px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .comic-panel {
      background: var(--parchment-card);
      border: 3px solid var(--border-comic);
      border-radius: var(--radius-lg);
      box-shadow: 5px 5px 0 rgba(42, 32, 24, 0.18);
      padding: 18px;
      margin-bottom: 18px;
    }

    @media (min-width: 640px) {
      .comic-panel {
        padding: 26px;
      }
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ocean-mid);
      color: #FFFDF8;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid var(--border-comic);
    }

    .chapter-heading {
      margin: 10px 0 6px;
      font-size: 1.44rem;
      line-height: 1.25;
      color: var(--ocean-deep);
    }

    /* ================= BUTTONS ================= */
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.94rem;
      border-radius: var(--radius-md);
      border: 2.5px solid var(--border-comic);
      padding: 10px 16px;
      min-height: 48px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      text-decoration: none;
      touch-action: manipulation;
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--ocean-mid);
      color: #FFFDF8;
      box-shadow: 3px 3px 0 var(--border-comic);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--ocean-deep);
    }

    .btn-gold {
      background: var(--gold-bright);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--border-comic);
    }
    .btn-gold:hover:not(:disabled) {
      background: #F7D170;
    }

    .btn-emerald {
      background: var(--emerald);
      color: #FFFDF8;
      box-shadow: 3px 3px 0 var(--border-comic);
    }
    .btn-emerald:hover:not(:disabled) {
      background: #1B623B;
    }

    .btn-soft {
      background: var(--parchment);
      color: var(--ink);
      box-shadow: 2px 2px 0 rgba(42, 32, 24, 0.2);
    }
    .btn-soft:hover:not(:disabled) {
      background: var(--parchment-dark);
    }

    .btn-sm {
      min-height: 40px;
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 10px;
    }

    .btn-speak {
      background: var(--gold-soft);
      color: var(--ink);
      border: 2px solid var(--border-comic);
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 40px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn-speak:hover {
      background: var(--gold-bright);
    }

    .btn-speak.speaking-active {
      background: var(--spice-red);
      color: #FFFDF8;
    }

    button:focus-visible, a:focus-visible, select:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    /* ================= OVERVIEW / ROADMAP ================= */
    .overview-hero {
      background: linear-gradient(135deg, #FFFDF8 0%, #FDF4DC 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 18px;
      background: var(--parchment-dark);
      border: 2px solid var(--border-comic);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-bright), var(--emerald));
      transition: width 0.3s ease;
    }

    .roadmap-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    @media (min-width: 680px) {
      .roadmap-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .roadmap-card {
      background: var(--parchment);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: inherit;
      touch-action: manipulation;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .roadmap-card:hover {
      background: var(--gold-soft);
      transform: translateY(-2px);
    }

    .roadmap-card.done {
      background: var(--emerald-soft);
      border-color: var(--emerald);
    }

    .roadmap-task-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid rgba(42, 32, 24, 0.25);
      color: var(--ink-muted);
    }

    /* ================= COMIC STAGE & BUBBLES ================= */
    .comic-stage {
      background: linear-gradient(180deg, #E3F2FA 0%, #FBF4E4 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px;
      margin: 14px 0 16px;
      position: relative;
      overflow: hidden;
    }

    .comic-stage.warm-bg {
      background: linear-gradient(180deg, #FDF1CE 0%, #FBF4E4 100%);
    }

    .comic-stage.serious-bg {
      background: linear-gradient(180deg, #F8E8E4 0%, #FBF4E4 100%);
    }

    .stage-scene {
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: center;
    }

    @media (min-width: 720px) {
      .stage-scene {
        grid-template-columns: 235px 1fr;
      }
    }

    .cast-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .char-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .char-box svg {
      display: block;
    }

    .char-name-tag {
      margin-top: 4px;
      background: var(--ink);
      color: #FFFDF8;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 999px;
    }

    .dialogue-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .speech-bubble {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 11px 14px;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .speech-bubble.timo {
      background: #F4FAFF;
      border-left: 7px solid var(--ocean-mid);
    }

    .speech-bubble.koko {
      background: #FFF9E6;
      border-left: 7px solid var(--gold);
    }

    .speech-bubble.kolonist {
      border-left: 7px solid #7C5C38;
    }

    .speech-bubble.minenarbeiter {
      border-left: 7px solid #8A4A32;
    }

    .speech-bubble.priester {
      border-left: 7px solid #5B4378;
    }

    .speech-bubble.narrator {
      background: var(--gold-soft);
      border-style: dashed;
    }

    .speech-bubble.speaking {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(244, 197, 82, 0.55);
    }

    .speech-speaker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ocean-mid);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speech-text {
      margin: 0;
      font-size: 0.98rem;
    }

    .term-btn {
      background: var(--gold-bright);
      color: var(--ink);
      border: 1.5px solid var(--border-comic);
      border-radius: 7px;
      padding: 1px 7px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.94em;
      cursor: pointer;
      display: inline-block;
      line-height: 1.35;
      touch-action: manipulation;
    }

    .term-btn:hover {
      background: #FFE082;
    }

    /* ================= MAPS & SVG OVERLAYS ================= */
    .map-frame {
      background: linear-gradient(180deg, #E8F4FA 0%, #D9EEF8 100%);
      border: 3px solid var(--border-comic);
      border-radius: 18px;
      padding: 12px;
      margin: 14px 0;
    }

    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .map-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2.5px solid var(--border-comic);
      background: #B9DCF0;
      box-shadow: 0 4px 14px rgba(21, 50, 77, 0.14);
    }

    .map-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .map-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .filter-pill {
      border: 2px solid var(--border-comic);
      background: #FFFDF8;
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 11px;
      min-height: 38px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .filter-pill.active {
      background: var(--ocean-deep);
      color: #FFFDF8;
      box-shadow: 2px 2px 0 var(--gold-bright);
    }

    .swatch-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1.5px solid var(--border-comic);
      display: inline-block;
      flex-shrink: 0;
    }

    /* ================= HISTORICAL SOURCES ================= */
    .sources-box {
      background: linear-gradient(135deg, #FBF4E4 0%, #F5E9D0 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px 16px;
      margin: 14px 0;
    }

    .sources-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--ocean-deep);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sources-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 680px) {
      .sources-grid.two-cols {
        grid-template-columns: 1fr 1fr;
      }
    }

    .source-card {
      background: var(--parchment-card);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
    }

    .source-img-btn {
      padding: 0;
      border: none;
      background: #221A14;
      cursor: pointer;
      position: relative;
      display: block;
      width: 100%;
      height: 220px;
      overflow: hidden;
    }

    .source-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
      transition: transform 0.2s ease;
    }

    .source-img-btn:hover img {
      transform: scale(1.03);
    }

    .source-zoom-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(255, 253, 248, 0.95);
      color: var(--ink);
      border: 1.5px solid var(--border-comic);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.76rem;
      font-weight: 800;
      font-family: inherit;
    }

    .source-meta {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .source-caption {
      font-weight: 800;
      font-size: 0.94rem;
      color: var(--ocean-deep);
      line-height: 1.3;
    }

    .source-credit {
      font-size: 0.74rem;
      color: var(--ink-muted);
    }

    .source-hint {
      margin: 4px 0 0;
      font-size: 0.86rem;
      line-height: 1.45;
      color: var(--ink);
    }

    /* ================= INTERACTIVE ENGRAVING (HOTSPOTS) ================= */
    .engraving-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2.5px solid var(--border-comic);
      background: #221A14;
      margin-top: 10px;
    }

    .engraving-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 3px solid #FFFDF8;
      background: var(--spice-red);
      color: #FFFDF8;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      touch-action: manipulation;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .hotspot-btn:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .hotspot-btn.visited {
      background: var(--emerald);
    }

    .hotspot-btn.active {
      background: var(--gold-bright);
      color: var(--ink);
      border-color: var(--border-comic);
      transform: translate(-50%, -50%) scale(1.16);
    }

    .hotspot-info {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--parchment-card);
      border: 2px solid var(--gold);
    }

    /* ================= TASK BOXES & INTERACTIVE WIDGETS ================= */
    .task-box {
      background: #EEF6FB;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
    }

    .task-subbox {
      background: #FFFDF8;
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
    }

    .chip-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .tap-chip {
      background: var(--gold-soft);
      border: 2px solid var(--border-comic);
      border-radius: 999px;
      padding: 7px 14px;
      min-height: 44px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 2px 0 rgba(42, 32, 24, 0.14);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .tap-chip:hover {
      background: var(--gold-bright);
      transform: translateY(-1px);
    }

    .tap-chip.selected {
      background: var(--gold-bright);
      box-shadow: 0 0 0 3px var(--ocean-mid);
      transform: translateY(-1px);
    }

    .tap-chip.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .tap-chip.wrong {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    .tap-chip.muted-chip {
      background: var(--parchment);
      border-color: #B8A78B;
    }

    /* Colony Table (Step 1) */
    .colony-table {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .colony-row {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 14px;
      padding: 11px 13px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    @media (min-width: 640px) {
      .colony-row {
        grid-template-columns: 230px 1fr;
        align-items: center;
      }
    }

    .colony-row.drop-ready:hover {
      background: #FFF8E1;
      border-color: var(--ocean-mid);
    }

    .colony-row.example-row {
      background: #EEF5FD;
      cursor: default;
    }

    .colony-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 44px;
      align-items: center;
      padding: 4px 8px;
      border-radius: 10px;
      border: 2px dashed rgba(42, 32, 24, 0.25);
      background: rgba(251, 244, 228, 0.55);
    }

    /* Quiz MC Options */
    .quiz-option {
      width: 100%;
      text-align: left;
      background: var(--parchment-card);
      border: 2px solid var(--border-comic);
      border-radius: 12px;
      padding: 11px 14px;
      min-height: 48px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }

    .quiz-option:hover {
      background: var(--gold-soft);
    }

    .quiz-option.selected {
      background: var(--gold-bright);
      border-color: var(--ocean-mid);
      box-shadow: 0 0 0 2px var(--ocean-mid);
    }

    .quiz-option.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .quiz-option.wrong {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    /* Food Grid (Step 3) */
    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    @media (min-width: 640px) {
      .food-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .food-card {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      touch-action: manipulation;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .food-card:hover {
      transform: translateY(-2px);
    }

    .food-card.crossed {
      border-color: var(--spice-red);
      background: #FFF6F4;
    }

    .food-card.ok-card {
      border-color: var(--emerald);
      box-shadow: 0 0 0 2px var(--emerald);
    }

    .food-card.err-card {
      border-color: var(--spice-red);
      box-shadow: 0 0 0 2px var(--spice-red);
    }

    .food-img-wrap {
      position: relative;
      width: 100%;
      height: 120px;
      background: #E8DEC8;
    }

    .food-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .food-card.crossed .food-img-wrap img {
      filter: grayscale(40%) brightness(0.82);
    }

    .food-strike-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(184, 64, 44, 0.25);
      pointer-events: none;
    }

    .food-strike-line {
      width: 120%;
      height: 6px;
      background: var(--spice-red);
      border: 1.5px solid #FFFDF8;
      transform: rotate(-18deg);
    }

    .food-body {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .food-title {
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--ink);
    }

    .food-card.crossed .food-title {
      text-decoration: line-through;
      color: var(--spice-red);
    }

    /* Sort Zones (Step 4 & Step 8) */
    .sort-zones {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    @media (min-width: 640px) {
      .sort-zones {
        grid-template-columns: 1fr 1fr;
      }
    }

    .sort-zone {
      background: var(--parchment);
      border: 2.5px dashed var(--border-comic);
      border-radius: 14px;
      padding: 12px;
      min-height: 100px;
      cursor: pointer;
    }

    .sort-zone:hover {
      background: #FDF5DF;
    }

    /* Primary Source Quote Box (Step 5 & 6) */
    .primary-source-box {
      background: #FFF9EB;
      border: 2.5px solid var(--gold);
      border-left: 8px solid var(--spice-red);
      border-radius: 14px;
      padding: 14px 16px;
      margin: 14px 0;
    }

    .primary-quote {
      font-style: italic;
      font-size: 0.94rem;
      line-height: 1.65;
      color: #2A1F18;
      margin: 8px 0 0;
    }

    /* Textarea & Checklist (Step 5) */
    .role-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 10px 0 14px;
    }

    @media (min-width: 640px) {
      .role-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .role-card-btn {
      background: var(--parchment);
      border: 2.5px solid var(--border-comic);
      border-radius: 14px;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 54px;
      touch-action: manipulation;
    }

    .role-card-btn.selected {
      background: var(--gold-bright);
      box-shadow: 3px 3px 0 var(--border-comic);
    }

    .ipad-textarea {
      width: 100%;
      min-height: 170px;
      border: 2.5px solid var(--border-comic);
      border-radius: 14px;
      padding: 14px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.55;
      color: var(--ink);
      background: #FFFFFF;
      resize: vertical;
    }

    .ipad-textarea:focus {
      outline: 3px solid var(--gold-bright);
      border-color: var(--ocean-mid);
    }

    .ipad-input {
      width: 100%;
      border: 2px solid var(--border-comic);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 46px;
      font-family: inherit;
      font-size: 0.96rem;
      color: var(--ink);
      background: #FFFFFF;
    }

    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .check-item {
      background: var(--parchment);
      border: 1.5px solid #CBB999;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-item.met {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      font-weight: 700;
      color: #124026;
    }

    /* Cloze Blanks (Step 6) */
    .cloze-paragraph {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 14px;
      line-height: 2.05;
      font-size: 0.96rem;
    }

    .cloze-blank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 112px;
      min-height: 36px;
      padding: 2px 10px;
      margin: 0 3px;
      border-radius: 10px;
      border: 2px dashed var(--ocean-mid);
      background: #FFFDF8;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--ocean-deep);
      cursor: pointer;
      vertical-align: middle;
      touch-action: manipulation;
    }

    .cloze-blank.filled {
      border-style: solid;
      background: var(--gold-soft);
      border-color: var(--border-comic);
    }

    .cloze-blank.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .cloze-blank.wrong {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    /* Step 7 Matching Grid */
    .match-photos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    @media (min-width: 640px) {
      .match-photos-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .match-photo-card {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .match-photo-card.matched {
      border-color: var(--emerald);
      box-shadow: 0 0 0 2px var(--emerald);
    }

    .match-drop-btn {
      width: 100%;
      border: none;
      border-top: 2px dashed rgba(42, 32, 24, 0.25);
      background: var(--parchment);
      padding: 11px 12px;
      min-height: 56px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }

    .match-drop-btn.ready {
      background: #FFF7DC;
    }

    .match-drop-btn.matched {
      background: var(--emerald-soft);
      border-top: 2px solid var(--emerald);
      color: #124026;
      cursor: default;
    }

    .match-text-btn {
      width: 100%;
      text-align: left;
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 12px;
      padding: 11px 14px;
      min-height: 52px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .match-text-btn.selected {
      background: var(--gold-bright);
      box-shadow: 0 0 0 3px var(--ocean-mid);
    }

    .feedback-banner {
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      margin-top: 10px;
      border: 2px solid;
      font-size: 0.92rem;
    }

    .feedback-banner.ok {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .feedback-banner.retry {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    details.info-ref {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 10px 14px;
      margin: 14px 0;
    }

    details.info-ref summary {
      cursor: pointer;
      font-weight: 800;
      color: var(--ocean-deep);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
    }

    details.info-ref summary::-webkit-details-marker {
      display: none;
    }

    .info-ref-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1.5px dashed rgba(42, 32, 24, 0.25);
      font-size: 0.92rem;
      color: var(--ink);
    }

    /* ================= DIALOGS ================= */
    dialog.edu-dialog {
      border: 3px solid var(--border-comic);
      border-radius: 20px;
      padding: 0;
      max-width: 760px;
      width: calc(100% - 28px);
      background: var(--parchment-card);
      color: var(--ink);
      box-shadow: 0 20px 50px rgba(21, 50, 77, 0.42);
    }

    dialog.edu-dialog::backdrop {
      background: rgba(21, 50, 77, 0.65);
      backdrop-filter: blur(2px);
    }

    .dialog-head {
      background: var(--ocean-deep);
      color: #FFFDF8;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 3px solid var(--gold);
    }

    .dialog-body {
      padding: 18px;
      max-height: 76vh;
      overflow-y: auto;
    }

    .source-dialog-img {
      width: 100%;
      max-height: 58vh;
      object-fit: contain;
      background: #1C1611;
      border-radius: 12px;
      border: 2px solid var(--border-comic);
      display: block;
    }

    .nav-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 2px dashed rgba(42, 32, 24, 0.2);
    }

    /* ================= ANIMATIONS ================= */
    @keyframes comicBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(0.8deg); }
    }

    @keyframes parrotHop {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      45% { transform: translateY(-6px) rotate(3deg); }
      65% { transform: translateY(-2px) rotate(-1deg); }
    }

    .anim-bob {
      animation: comicBob 3.2s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .anim-bob-delay {
      animation: comicBob 3.4s ease-in-out 0.7s infinite;
      transform-origin: center bottom;
    }

    .anim-parrot {
      animation: parrotHop 2.6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-bob, .anim-bob-delay, .anim-parrot {
        animation: none !important;
      }
      * {
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    // Fallback for older iPadOS Safari versions without ctx.roundRect
    if (typeof CanvasRenderingContext2D !== "undefined" && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const rad = Math.min(Array.isArray(r) ? r[0] : (r || 0), Math.abs(w) / 2, Math.abs(h) / 2);
        this.moveTo(x + rad, y);
        this.arcTo(x + w, y, x + w, y + h, rad);
        this.arcTo(x + w, y + h, x, y + h, rad);
        this.arcTo(x, y + h, x, y, rad);
        this.arcTo(x, y, x + w, y, rad);
        this.closePath();
        return this;
      };
    }

    // =========================================================================
    // 1. WÖRTERBUCH / GLOSSAR (LEICHT VERSTÄNDLICH)
    // =========================================================================
    const GLOSSARY = {
      uebersee: {
        word: "Übersee",
        short: "Gebiete auf der anderen Seite eines Ozeans",
        text: "Gebiete, die von Europa aus gesehen auf der anderen Seite eines grossen Ozeans (z. B. des Atlantiks) liegen."
      },
      vegetation: {
        word: "Vegetation",
        short: "Alle Pflanzen in einem Gebiet",
        text: "Die gesamte Pflanzenwelt einer Region – zum Beispiel dichte Urwälder, Grassteppen oder Wüsten."
      },
      kolonie: {
        word: "Kolonie",
        short: "Abhängiges Gebiet eines fremden Staates",
        text: "Ein Gebiet, das von einem fremden Land erobert oder gekauft wurde. Es wird vom Heimatland verwaltet; die Menschen dort dürfen nicht selbst über Gesetze bestimmen."
      },
      kolonialisierung: {
        word: "Kolonialisierung",
        short: "Eroberung und Beherrschung fremder Gebiete",
        text: "Der Vorgang, bei dem mächtige Staaten fremde Länder in Übersee erobern, beherrschen, besiedeln und ihre Rohstoffe ausbeuten."
      },
      plantage: {
        word: "Plantage",
        short: "Riesiges Feld mit nur einer Pflanzenart",
        text: "Ein grosses landwirtschaftliches Gebiet, auf dem nur eine einzige Sorte (z. B. Zuckerrohr, Kakao, Tabak oder Baumwolle) angebaut wird. Vom französischen Wort «plante» (Pflanze)."
      },
      quinto: {
        word: "Fünftel (Quinto)",
        short: "Steuer an den spanischen König",
        text: "Ein Fünftel (20 %) alles geförderten Goldes und Silbers mussten die Minenbesitzer in Amerika als Steuer an das spanische Königshaus abgeben."
      },
      quecksilber: {
        word: "Quecksilber",
        short: "Giftiges flüssiges Metall",
        text: "Ein bei Raumtemperatur flüssiges, sehr giftiges Metall. Die Spanier brauchten es in den Silberbergwerken, um Silber aus dem Erz herauszuschmelzen."
      },
      stollen: {
        word: "Stollen",
        short: "Unterirdischer Gang im Bergwerk",
        text: "Ein waagrecht oder schräg in den Berg gegrabener Tunnel, in dem Arbeiter mit Pickeln und Hämmern Erz abbauen."
      },
      silberflotte: {
        word: "Silberflotte",
        short: "Bewaffneter Schiffskonvoi nach Spanien",
        text: "Grosse Gruppen schwer bewaffneter spanischer Schiffe, die das geraubte Gold und Silber regelmässig über den Atlantik nach Spanien brachten."
      },
      dreieckshandel: {
        word: "Dreieckshandel",
        short: "Handelskreislauf zwischen Europa, Afrika & Amerika",
        text: "Ein grausamer Seehandel im 16.–19. Jahrhundert: Fertigwaren gingen von Europa nach Afrika, versklavte Menschen von Afrika nach Amerika, und Plantagen-Rohstoffe von Amerika nach Europa."
      },
      manufaktur: {
        word: "Manufaktur",
        short: "Grosse Werkstatt vor der Fabrikzeit",
        text: "Ein grösserer Handwerksbetrieb in Europa, in dem viele Arbeiter Rohstoffe (wie Baumwolle, Zucker oder Kakao) in Handarbeit zu Waren verarbeiteten."
      },
      ruhr: {
        word: "Ruhr",
        short: "Schwere Durchfallerkrankung",
        text: "Alte Bezeichnung für eine lebensgefährliche Darmentzündung durch Bakterien oder Parasiten – häufig auf überfüllten, schmutzigen Schiffen."
      },
      auktion: {
        word: "Auktion",
        short: "Versteigerung an den Meistbietenden",
        text: "Ein öffentlicher Verkauf, bei dem Käufer immer höhere Preise bieten. Auf solchen Märkten wurden versklavte Menschen wie Ware verkauft."
      },
      zwangskonvertierung: {
        word: "Zwangskonvertierung",
        short: "Aufzwingen einer neuen Religion",
        text: "Wenn Menschen gezwungen werden, ihren eigenen Glauben aufzugeben und eine fremde Religion (hier das Christentum) anzunehmen."
      },
      bildschrift: {
        word: "Bildschrift (Codex)",
        short: "Gemalte Bücher der Azteken",

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...createDefaultState(), ...parsed };
        }
      } catch (_) {}
      document.documentElement.style.setProperty("--font-scale", String(state.fontScale || 1));
      updateFontLabel();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function resetProgress() {
      if (confirm("Möchtest du wirklich alle Aufgaben und dein Tagebuch zurücksetzen?")) {
        const scale = state.fontScale;
        localStorage.removeItem(STORAGE_KEY);
        state = createDefaultState();
        state.fontScale = scale;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function markStepDone(stepIdx) {
      if (!state.completed[stepIdx]) {
        state.completed[stepIdx] = true;
      }
      saveState();
      renderHeaderStats();
      renderStepper();
    }

    function goToStep(stepIdx) {
      if (stepIdx < 0 || stepIdx >= STEPS.length) return;
      stopSpeech();
      if (triAnimFrame) {
        cancelAnimationFrame(triAnimFrame);
        triAnimFrame = null;
      }
      state.currentStep = stepIdx;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =========================================================================

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRichText(raw) {
      return escapeHtml(raw).replace(/\{\{(\w+)\}\}/g, (_, key) => {
        const entry = GLOSSARY[key];
        if (!entry) return key;
        return `<button type="button" class="term-btn" onclick="openSingleTerm('${key}')">${entry.word}</button>`;
      });
    }

    function stripTokensForSpeech(raw) {
      return raw.replace(/\{\{(\w+)\}\}/g, (_, key) => GLOSSARY[key] ? GLOSSARY[key].word : key);
    }

    function updateFontLabel() {
      const el = document.getElementById("fontLabel");
      if (!el) return;
      el.textContent = state.fontScale === 1 ? "A+" : state.fontScale === 1.15 ? "A++" : "Normal";
    }

    function toggleFontSize() {
      state.fontScale = state.fontScale === 1 ? 1.15 : state.fontScale === 1.15 ? 1.3 : 1;
      document.documentElement.style.setProperty("--font-scale", String(state.fontScale));
      updateFontLabel();
      saveState();
    }

    function copyTextToClipboard(text, successMsg) {
      const showToast = (msg) => {
        const toast = document.getElementById("copy-toast");
        if (toast) toast.textContent = msg;
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          () => showToast(successMsg),
          () => fallbackCopyText(text, successMsg, showToast)
        );
      } else {
        fallbackCopyText(text, successMsg, showToast);
      }
    }

    function fallbackCopyText(text, successMsg, showToast) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successMsg);
      } catch (_) {
        alert("Kopieren fehlgeschlagen. Markiere den Text manuell:\n\n" + text);
      }
      document.body.removeChild(ta);
    }

    }

    function renderStep1() {
      const placedIds = new Set(Object.values(state.colTable).flat());
      const unplaced = COLONY_CHIPS.filter(c => !placedIds.has(c.id));
      const allPlaced = unplaced.length === 0;
      const allRight = allPlaced && Object.entries(state.colTable).every(([pId, list]) =>
        list.every(cid => COLONY_CHIPS.find(c => c.id === cid)?.owner === pId)
      );

      const editablePowers = D1_POWERS.filter(p => p.id !== "denmark");

      return `
        <section class="comic-panel">
          ${renderStoryBox(1)}

          <div class="map-frame">
            <div class="map-toolbar">
              <strong style="color:var(--ocean-deep); font-size:0.94rem;">🗺️ D1: Die europäischen Kolonien (Mitte 18. Jh.) – Tippe auf einen Staat zum Hervorheben:</strong>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
              <button type="button" class="filter-pill ${state.mapFilter === "all" ? "active" : ""}" onclick="setMapFilter('all')">🌍 Alle zeigen</button>
              ${D1_POWERS.map(p => `
                <button type="button" class="filter-pill ${state.mapFilter === p.id ? "active" : ""}" onclick="setMapFilter('${p.id}')">
                  <span class="swatch-dot" style="background:${p.color};"></span> ${p.name}
                </button>
              `).join("")}
            </div>
            <div class="map-wrap">
              <img src="./assets/karte-welt-kolonien.jpg" alt="Physische Weltkarte mit europäischen Kolonialgebieten im 18. Jahrhundert">
              ${renderD1WorldMapSVG()}
            </div>
          </div>

          <div class="task-box">
            <strong style="color:var(--ocean-deep); font-size:1.02rem;">✍️ Auftrag: Ergänze die Kolonien-Tabelle mithilfe der Karte!</strong>
            <p style="margin:4px 0 8px; font-size:0.9rem; color:var(--ink-muted);">
              Tippe zuerst eine <strong>Kolonie</strong> unten an und dann die <strong>Zeile des passenden Staates</strong>. Dänemark ist schon als Beispiel gelöst! (Zum Entfernen auf ein eingesetztes Kärtchen tippen.)
            </p>

            <div class="chip-pool" aria-label="Noch zuzuordnende Kolonien">
              ${unplaced.length
                ? unplaced.map(c => `
                    <button type="button" class="tap-chip ${state.colSelectedChip === c.id ? "selected" : ""}" onclick="selectColonyChip('${c.id}')">
                      📍 ${c.label}
                    </button>
                  `).join("")
                : `<span style="font-size:0.88rem; font-weight:700; color:var(--emerald);">✅ Alle 16 Kolonien wurden in die Tabelle eingesetzt!</span>`
              }
            </div>

            <div class="colony-table">
              <div class="colony-row example-row">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                  <strong style="display:flex; align-items:center; gap:8px;">
                    <span class="swatch-dot" style="background:#4D8FD6; width:16px; height:16px;"></span> Dänemark (Beispiel)
                  </strong>
                  <button type="button" class="btn btn-soft btn-sm" onclick="setMapFilter('denmark')">🗺️</button>
                </div>
                <div style="font-size:0.88rem; font-weight:700; color:#154782;">
                  Norwegen, Island, Grönland, Goldküste
                </div>
              </div>

              ${editablePowers.map(p => {
                const list = state.colTable[p.id] || [];
                return `
                  <div class="colony-row ${state.colSelectedChip ? "drop-ready" : ""}" onclick="placeColonyInto('${p.id}')">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                      <strong style="display:flex; align-items:center; gap:8px;">
                        <span class="swatch-dot" style="background:${p.color}; width:16px; height:16px;"></span> ${p.name}
                      </strong>
                      <button type="button" class="btn btn-soft btn-sm" onclick="event.stopPropagation(); setMapFilter('${p.id}')" title="Auf Karte hervorheben">🗺️</button>
                    </div>
                    <div class="colony-slots">
                      ${list.length
                        ? list.map(cid => {
                            const chip = COLONY_CHIPS.find(c => c.id === cid);
                            let cls = "tap-chip";
                            if (state.colChecked && chip) {
                              cls += chip.owner === p.id ? " correct" : " wrong";
                            }
                            return `<button type="button" class="${cls}" style="min-height:36px; padding:4px 10px; font-size:0.82rem;" onclick="event.stopPropagation(); removeColonyChip('${p.id}', '${cid}')">${chip ? chip.label : cid} ✕</button>`;
                          }).join("")
                        : `<span style="font-size:0.82rem; color:var(--ink-muted);">${state.colSelectedChip ? "👉 Hier tippen zum Einsetzen" : "Noch leer …"}</span>`
                      }
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

            <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center;">
              <button type="button" class="btn btn-soft btn-sm" onclick="resetColonyTable()">🔄 Tabelle leeren</button>
              <button type="button" class="btn btn-emerald" onclick="checkColonyTable()">✅ Tabelle prüfen</button>
            </div>

            ${state.colChecked ? (
              allRight
                ? `<div class="feedback-banner ok">⭐ Stark! Alle 16 Kolonien sind richtig zugeordnet! Weitere Gebiete auf der Karte: Spanien (Kuba, La Plata), Portugal (Goa, Madeira), Niederlande (Ceylon, Molukken), Grossbritannien (Neufundland, Bahamas) und Frankreich (Senegambien).</div>`
                : `<div class="feedback-banner retry">💡 ${allPlaced ? "Manche Kärtchen sind noch rot markiert. Tippe sie an, um sie zu entfernen, und schau mit dem 🗺️-Button auf die Karte!" : "Es fehlen noch Kolonien aus dem oberen Pool (oder manche sind rot markiert). Ordne zuerst alle 16 Kolonien zu."}</div>`
            ) : ""}
          </div>

          ${renderInfoAccordion(1)}
          ${renderChapterFooter(1)}
        </section>
      `;
    }

    function setMapFilter(powerId) {
      state.mapFilter = powerId;
      saveState();
      render();
    }

    function selectColonyChip(cid) {
      state.colSelectedChip = state.colSelectedChip === cid ? null : cid;
      saveState();
      render();
    }

    function placeColonyInto(powerId) {
      if (!state.colSelectedChip) return;
      const cid = state.colSelectedChip;
      if (!state.colTable[powerId].includes(cid)) {
        state.colTable[powerId].push(cid);
      }
      state.colSelectedChip = null;
      state.colChecked = false;
      saveState();
      render();
    }

    function removeColonyChip(powerId, cid) {
      state.colTable[powerId] = (state.colTable[powerId] || []).filter(id => id !== cid);
      state.colChecked = false;
      saveState();
      render();
    }

    function resetColonyTable() {
      state.colTable = { spain: [], portugal: [], netherlands: [], britain: [], france: [] };
      state.colSelectedChip = null;
      state.colChecked = false;
      delete state.completed[1];
      saveState();
      render();
    }

    function checkColonyTable() {
      state.colChecked = true;
      const placedCount = Object.values(state.colTable).flat().length;
      const allRight = placedCount === COLONY_CHIPS.length &&
        Object.entries(state.colTable).every(([pId, list]) =>
          list.every(cid => COLONY_CHIPS.find(c => c.id === cid)?.owner === pId)
        );
      if (allRight) markStepDone(1);
      else saveState();
      render();
    }

    // =========================================================================
    // 12. STEP 2: DIE KOLONIE (5-FRAGEN-CHECK)
    // =========================================================================
    function isDefQuestionRight(q) {
      const ans = state.defAnswers[q.id];
      if (q.type === "single") return ans === q.correct;
      const expected = q.options.filter(o => o.ok).map(o => o.id).sort().join(",");
      const actual = (ans || []).slice().sort().join(",");
      return expected === actual;
    }

    function renderStep2() {
      const allRight = DEF_QUESTIONS.every(isDefQuestionRight);
      return `
        <section class="comic-panel">
          ${renderStoryBox(2)}

          <div class="sources-box">
            <div class="sources-title">🖼️ Historische Bildquellen zum Kapitel (antippen zum Vergrössern)</div>
            <div class="sources-grid two-cols">
              ${renderSourceCard("kolonistenHaus")}
              ${renderSourceCard("lasCasas")}
            </div>
          </div>

          <div class="task-box">
            <strong style="color:var(--ocean-deep); font-size:1.02rem;">✍️ Auftrag: Beantworte alle 5 Verständnisfragen (per Antippen)</strong>
            ${DEF_QUESTIONS.map(q => {
              const ok = state.defChecked && isDefQuestionRight(q);
              return `
                <div class="task-subbox">
                  <div style="font-weight:800; color:var(--ocean-deep); margin-bottom:8px;">${q.prompt}</div>
                  ${q.type === "single" ? `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                      ${q.options.map((opt, idx) => {
                        const sel = state.defAnswers[q.id] === idx;
                        let cls = "quiz-option";
                        if (state.defChecked) {
                          if (sel && idx === q.correct) cls += " correct";
                          else if (sel) cls += " wrong";
                        } else if (sel) {
                          cls += " selected";
                        }
                        const ico = state.defChecked ? (sel ? (idx === q.correct ? "✅" : "❌") : "⚪") : (sel ? "👉" : "⚪");
                        return `<button type="button" class="${cls}" onclick="setDefSingle('${q.id}', ${idx})"><span>${ico}</span><span>${opt}</span></button>`;
                      }).join("")}
                    </div>
                  ` : `
                    <div class="chip-pool">
                      ${q.options.map(opt => {
                        const sel = (state.defAnswers[q.id] || []).includes(opt.id);
                        let cls = "tap-chip muted-chip";
                        if (state.defChecked) {
                          if (sel && opt.ok) cls = "tap-chip correct";
                          else if (sel && !opt.ok) cls = "tap-chip wrong";
                        } else if (sel) {
                          cls = "tap-chip selected";
                        }
                        return `<button type="button" class="${cls}" onclick="toggleDefMulti('${q.id}', '${opt.id}')">${sel ? "✓ " : ""}${opt.label}</button>`;
                      }).join("")}
                    </div>
                  `}
                  ${state.defChecked ? `<div style="margin-top:6px; font-size:0.82rem; font-weight:700; color:${ok ? "var(--emerald)" : "var(--spice-red)"};">${ok ? "✅ Richtig beantwortet!" : "💡 Prüfe diese Frage nochmals anhand der Sprechblasen oben."}</div>` : ""}
                </div>
              `;
            }).join("")}

            <div style="margin-top:14px; display:flex; justify-content:flex-end;">
              <button type="button" class="btn btn-emerald" onclick="checkStep2()">✅ Alle 5 Fragen prüfen</button>
            </div>

            ${state.defChecked ? (
              allRight
                ? `<div class="feedback-banner ok">⭐ Hervorragend! Alle 5 Fragen zur Kolonie und Kolonialisierung sind richtig!</div>`
                : `<div class="feedback-banner retry">💡 Noch nicht ganz alle Fragen richtig – schau bei den rot markierten Hinweisen nach.</div>`
            ) : ""}
          </div>

          ${renderInfoAccordion(2)}
          ${renderChapterFooter(2)}
        </section>
      `;
    }

    function setDefSingle(qid, idx) {
      state.defAnswers[qid] = idx;
      state.defChecked = false;
      saveState();
      render();
    }

    function toggleDefMulti(qid, oid) {
      const list = state.defAnswers[qid] || [];
      if (list.includes(oid)) state.defAnswers[qid] = list.filter(x => x !== oid);
      else state.defAnswers[qid] = [...list, oid];
      state.defChecked = false;
      saveState();
      render();
    }

    function checkStep2() {
      state.defChecked = true;
      if (DEF_QUESTIONS.every(isDefQuestionRight)) markStepDone(2);
      else saveState();
      render();
    }

    // =========================================================================
    // 13. STEP 3: NUTZPFLANZEN & HAUSTIERE (12 GERICHTE + SPEISEKARTE 1492)
    // =========================================================================
    function isStep3Part1Ok() {
      const sel = new Set(state.foodSelected);
      return DISHES_12.every(d => d.isNew === sel.has(d.id));
    }

    function isStep3Part2Ok() {
      if (state.menuPicks.length !== 3) return false;
      return state.menuPicks.every(p => {
        const d = MENU_EXTRA_DISHES.find(x => x.id === p.dishId);
        return d && d.isNew && d.ing === p.ing;
      });
    }

    function renderStep3() {
      const selSet = new Set(state.foodSelected);
      const p1Ok = state.foodChecked && isStep3Part1Ok();
      const p2Ok = state.menuChecked && isStep3Part2Ok();

      return `
        <section class="comic-panel">
          ${renderStoryBox(3)}

          <div class="sources-grid two-cols" style="margin:12px 0;">
            <div class="task-subbox" style="margin-top:0; background:#EEF6FB;">
              <strong style="color:var(--ocean-deep);">🚢 Von Europa nach Amerika gebracht:</strong>
              <p style="margin:6px 0 0; font-size:0.9rem;">Weizen, Reis, Weinreben, Zuckerrohr, Kaffee, Pferde, Rinder, Schweine</p>
            </div>
            <div class="task-subbox" style="margin-top:0; background:#FDF6DF;">
              <strong style="color:#8C5800;">🌎 Von Amerika nach Europa gekommen:</strong>
              <p style="margin:6px 0 0; font-size:0.9rem;">Kartoffeln («Brot des armen Mannes»), Tomaten, Bohnen, Mais, Tabak, Kakao, Truthahn</p>
            </div>
          </div>

          <div class="task-box">
            <strong style="color:var(--ocean-deep); font-size:1.02rem;">🍽️ Auftrag 3.1: Streiche die neuen Speisen durch!</strong>
            <p style="margin:4px 0 8px; font-size:0.9rem; color:var(--ink-muted);">
              Welche dieser 12 Speisen gibt es in Europa <strong>erst seit der Entdeckung Amerikas (1492)</strong>? Tippe sie an, um sie durchzustreichen! (Tipp: Es sind 7 Gerichte.)
            </p>

            <div class="food-grid">
              ${DISHES_12.map(d => {
                const isCrossed = selSet.has(d.id);
                const isCorrect = d.isNew === isCrossed;
                let cls = "food-card";
                if (isCrossed) cls += " crossed";
                if (state.foodChecked) cls += isCorrect ? " ok-card" : " err-card";
                return `
                  <button type="button" class="${cls}" onclick="toggleFoodDish('${d.id}')">
                    <div class="food-img-wrap">
                      <img src="${d.img}" alt="${escapeHtml(d.name)}">
                      ${isCrossed ? `<div class="food-strike-overlay"><div class="food-strike-line"></div></div>` : ""}
                    </div>
                    <div class="food-body">
                      <div class="food-title">${d.name}</div>
                      ${state.foodChecked ? `
                        <div style="font-size:0.74rem; line-height:1.35; font-weight:700; color:${isCorrect ? "var(--emerald)" : "var(--spice-red)"};">
                          ${isCorrect ? "✅" : "❌"} ${d.reason}
                        </div>
                      ` : `<div style="font-size:0.74rem; color:var(--ink-muted);">${isCrossed ? "✂️ Erst seit 1492" : "Tippen zum Durchstreichen"}</div>`}
                    </div>
                  </button>
                `;
              }).join("")}
            </div>

            <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center;">
              <span style="font-size:0.86rem; font-weight:700;">Durchgestrichen: ${state.foodSelected.length} / 7</span>
              <button type="button" class="btn btn-emerald" onclick="checkFood12()">✅ 12 Gerichte prüfen</button>
            </div>
            ${state.foodChecked ? (
              p1Ok
                ? `<div class="feedback-banner ok">⭐ Volltreffer! Alle 12 Gerichte sind richtig eingeordnet!</div>`
                : `<div class="feedback-banner retry">💡 Schau bei den rot umrandeten Karten nach: Es gibt genau 7 Gerichte mit Kartoffeln, Truthahn, Tomaten, Bohnen, Mais oder Kakao.</div>`
            ) : ""}
          </div>

          <div class="task-box" style="background:#FFF8E6;">
            <strong style="color:var(--ocean-deep); font-size:1.02rem;">📋 Auftrag 3.2: Stelle deine «Entdecker-Speisekarte 1492» zusammen!</strong>
            <p style="margin:4px 0 8px; font-size:0.9rem; color:var(--ink-muted);">
              Wähle unten <strong>3 weitere Gerichte</strong> aus, die es vor 1492 in Europa noch <strong>nicht</strong> gab, und ordne jedem die passende Zutat aus Amerika zu!
            </p>

            <div class="chip-pool">
              ${MENU_EXTRA_DISHES.map(d => {
                const picked = state.menuPicks.some(p => p.dishId === d.id);
                let cls = "tap-chip muted-chip";
                if (picked) cls = "tap-chip selected";
                if (state.menuChecked && picked) cls = d.isNew ? "tap-chip correct" : "tap-chip wrong";
                return `<button type="button" class="${cls}" onclick="toggleExtraDish('${d.id}')">${d.icon} ${d.name}</button>`;
              }).join("")}
            </div>

            ${state.menuPicks.length ? `
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
                ${state.menuPicks.map(pick => {
                  const dish = MENU_EXTRA_DISHES.find(x => x.id === pick.dishId);
                  return `
                    <div class="task-subbox" style="margin-top:0;">
                      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                        <strong>${dish.icon} ${dish.name}</strong>
                        <span style="font-size:0.8rem; color:var(--ink-muted);">${dish.desc}</span>
                      </div>
                      <div style="font-size:0.8rem; font-weight:700; margin-top:6px; color:var(--ocean-deep);">Welche Zutat aus Amerika steckt darin?</div>
                      <div class="chip-pool" style="margin-bottom:0;">
                        ${AMERICAN_INGREDIENTS.map(ing => {
                          const isSel = pick.ing === ing;
                          let cls = "tap-chip muted-chip";
                          if (isSel) cls = "tap-chip selected";
                          if (state.menuChecked && isSel) {
                            cls = (dish.isNew && dish.ing === ing) ? "tap-chip correct" : "tap-chip wrong";
                          }
                          return `<button type="button" class="${cls}" style="min-height:38px; padding:5px 11px; font-size:0.82rem;" onclick="setDishIngredient('${pick.dishId}', '${ing}')">${ing}</button>`;
                        }).join("")}
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `<p style="font-size:0.86rem; color:var(--ink-muted); margin:6px 0;">Tippe oben auf 3 Gerichte …</p>`}

            <div style="margin-top:12px; display:flex; justify-content:flex-end;">
              <button type="button" class="btn btn-emerald" onclick="checkMenuExtra()">✅ Speisekarte prüfen</button>
            </div>
            ${state.menuChecked ? (
              p2Ok
                ? `<div class="feedback-banner ok">⭐ Super! Alle 3 Entdecker-Gerichte und ihre amerikanischen Zutaten stimmen!</div>`
                : `<div class="feedback-banner retry">💡 Wähle genau 3 Gerichte aus, die eine Zutat aus Amerika enthalten (nicht Käsefondue, Brezel oder Bratwurst) und tippe jeweils die richtige Zutat an.</div>`
            ) : ""}
          </div>

          ${renderInfoAccordion(3)}
          ${renderChapterFooter(3)}
        </section>
      `;
    }

    function toggleFoodDish(id) {
      if (state.foodSelected.includes(id)) state.foodSelected = state.foodSelected.filter(x => x !== id);
      else state.foodSelected = [...state.foodSelected, id];
      state.foodChecked = false;
      saveState();
      render();
    }

    function checkFood12() {
      state.foodChecked = true;
      if (isStep3Part1Ok() && isStep3Part2Ok()) markStepDone(3);
      else saveState();
      render();
    }

    function toggleExtraDish(dishId) {
      const idx = state.menuPicks.findIndex(p => p.dishId === dishId);
      if (idx >= 0) {
        state.menuPicks.splice(idx, 1);

      state.p4LayoutSelected = null;
      state.p4Checked = false;

    function countValidSentences(text) {
      return text
        .split(/[.!?]+/)
        .map(s => s.trim())
        .filter(s => s.split(/\s+/).filter(Boolean).length >= 3)
        .length;
    }

    function evaluateDiaryChecks(text) {
      const low = text.toLowerCase();
      const sCount = countValidSentences(text);
      return [
        { id: "len", label: `Mindestens 5 ganze Sätze (${sCount} / 5)`, met: sCount >= 5 },
        { id: "act", label: "Beschrieben, was die Person macht", met: /arbeit|steig|trag|brech|schlepp|grab|sammel|schmelz|beobacht|schreib|kletter|bau|förder|sieb|wasch/.test(low) },
        { id: "feel", label: "Gedanken oder Gefühle beschrieben", met: /fühl|denk|angst|erschöpf|müd|traurig|wütend|verzweif|schmerz|hoff|sorge|schock|entsetz|furcht|kraft|leiden|atem|krank/.test(low) },
        { id: "det", label: "Detail aus Bild oder Bericht (1616) genutzt", met: /potos|mine|stollen|leiter|silber|gold|quecksilber|staub|dampf|450|pfeiler|einsturz|verwalter|licht|lärm|haiti|tragsack|erz|pickel|hammer|vergift/.test(low) }
      ];
    }

    const REPORT_1616_TEXT = "Die Arbeit unter der Erde geschieht in Stollen, für die keinerlei Entlüftung besteht, durch die der Quecksilberstaub oder -dampf abziehen kann. Die Dämpfe und der Staub dringen den Indianern in Mund, Nase, Augen und Ohren. Sie verursachen Quecksilbervergiftung. So vergiftet kommen die Armen aus der Mine. Keiner heilt sie, krank erreichen sie ihre Heimat. Keinen lässt diese Krankheit wieder los. Die Betroffenen leben noch sechs oder acht Monate, vielleicht ein oder eineinhalb Jahre. So siechen sie dahin und sterben.\n\nAuf dem Berg leben an die 3000 bis 4000 Indianer und arbeiten in der Mine. Sie liegt in einem grossen Bergkegel und wühlt sich in immer grössere Tiefen hinein. Heute erstreckt sie sich in eine Tiefe von 450 Meter. Die Indianer brechen mit Pickeln und Hämmern das Erz. Wenn sie den Tragsack voll haben, steigen sie beladen mit dem Erz die Leitern hinauf. Diese sind teilweise aus Holz, teils aus Stricken. Das ist so mühselig, dass selbst ein Mensch, der nichts trägt, den Aufstieg kaum schafft. Die Arbeit da drinnen spielt sich ab in einem wirren Flackern von unzähligen Lichtern und unter dem ohrenbetäubenden Lärm eiserner Schlagwerkzeuge.\n\nSind nun die Zustände und körperlichen Strapazen schon schlimm genug, so schrecken die betrügerischen Grubenverwalter in ihrer blinden Habgier auch vor dem Äussersten nicht zurück. Bei der fortschreitenden Ausbeutung des Materials muss man den Berg absichern, damit nicht die Stollen über den Arbeitern zusammenstürzen. Man tut das, indem man von dem Erz, auch wenn es noch so reichhaltig ist (an Quecksilber), Stützpfeiler und Galerien stehen lässt. Nun gibt es aber derart gewissenlose Menschen, welche, um etwas von dem wertvollen Metall zu stehlen, ausserhalb der Arbeitszeit hinuntersteigen, unschuldige Indianer mit sich führen und von dem Erz, das die Stützpfeiler bildet, etwas abbauen. Manchmal kommt dann das halbe Gewölbe herunter und erschlägt die Indianer, hie und da auch die habgierigen Verwalter.";

            </div>

            </p>

            </p>

            <div style="font-weight:800; font-size:0.88rem; color:var(--ocean-deep);">1. Wähle zuerst deine Rolle:</div>
            <div class="role-grid">
              ${Object.values(DIARY_ROLES).map(r => `
                <button type="button" class="role-card-btn ${state.diaryRole === r.id ? "selected" : ""}" onclick="setDiaryRole('${r.id}')">
                  <span>${r.label}</span>
                </button>
              `).join("")}
            </div>

          ${renderChapterFooter(5)}
        </section>

    }

    function setDiaryRole(roleId) {
      state.diaryRole = roleId;
      saveState();
      render();
    }

    function appendDiarySnippet(kind, idx) {
      let addition = "";
      if (kind === "starter") addition = (DIARY_ROLES[state.diaryRole]?.starters[idx]) || "";
      else if (kind === "emotion") addition = (DIARY_EMOTIONS[idx] || "") + " ";
      else if (kind === "fact") addition = (DIARY_FACTS[idx] || "") + " ";
      const cur = state.diaryText || "";
      const sep = cur.length > 0 && !cur.endsWith(" ") && !cur.endsWith("\n") ? " " : "";
      state.diaryText = cur + sep + addition;
      saveState();
      render();
      const ta = document.getElementById("diary-textarea");
      if (ta) {
        ta.focus();
        ta.selectionStart = ta.selectionEnd = ta.value.length;
      }
    }

    function onDiaryInput(val) {
      state.diaryText = val;
      saveState();
      const checks = evaluateDiaryChecks(val);
      const items = document.querySelectorAll("#diary-checklist .check-item");
      checks.forEach((c, i) => {
        if (items[i]) {
          items[i].className = "check-item " + (c.met ? "met" : "");

            </div>

                ? `<div class="feedback-banner ok">⭐ Perfekt! Alle 4 Kontinente und alle 8 Handelsgüter sitzen an der richtigen Stelle!</div>`

    function answerTriQuiz(qid, idx) {
      state.triQuiz[qid] = idx;

      render();

    function selectTriToken(kind, id) {
      if (state.triSelectedToken && state.triSelectedToken.kind === kind && state.triSelectedToken.id === id) {
        state.triSelectedToken = null;
      } else {
        state.triSelectedToken = { kind, id };
      }
      saveState();
      render();
    }

    function clickTriContinentSlot(slotKey) {
      if (state.triSelectedToken?.kind === "cont") {
        state.triMapContinents[slotKey] = state.triSelectedToken.id;
        state.triSelectedToken = null;
        state.triMapChecked = false;
      } else if (state.triMapContinents[slotKey]) {
        state.triMapContinents[slotKey] = null;
        state.triMapChecked = false;
      }
      saveState();
      render();
    }

    function placeTriGood(legKey) {
      if (state.triSelectedToken?.kind !== "good") return;
      const gid = state.triSelectedToken.id;
      if (!state.triMapGoods[legKey].includes(gid)) state.triMapGoods[legKey].push(gid);
      state.triSelectedToken = null;
      state.triMapChecked = false;
      saveState();
      render();
    }

    function removeTriGood(legKey, gid) {
      state.triMapGoods[legKey] = state.triMapGoods[legKey].filter(x => x !== gid);
      state.triMapChecked = false;
      saveState();
      render();
    }

    function checkTriMap() {
      state.triMapChecked = true;
      checkStep6Completion();
      saveState();
      render();

      state.triClozeSelected = state.triClozeSelected === word ? null : word;
      saveState();
      render();
    }

    function clickClozeBlank(key) {
      if (state.triClozeSelected) {
        state.triCloze[key] = state.triClozeSelected;
        state.triClozeSelected = null;
        state.triClozeChecked = false;
      } else if (state.triCloze[key]) {
        state.triCloze[key] = null;
        state.triClozeChecked = false;
      }
      saveState();
      render();
    }

    function checkTriCloze() {
      state.triClozeChecked = true;
      checkStep6Completion();
      saveState();
      render();
    }

    function animateTriangleTrade() {
      const ship = document.getElementById("tri-ship");
      const legs = [
        document.getElementById("tri-leg-1"),
        document.getElementById("tri-leg-2"),
        document.getElementById("tri-leg-3")
      ];
      if (!ship || legs.some(l => !l)) return;
      if (triAnimFrame) cancelAnimationFrame(triAnimFrame);
      const lens = legs.map(l => l.getTotalLength());
      const total = lens.reduce((a, b) => a + b, 0);
      const dur = 4200;
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / dur);
        let dist = t * total;
        let legIdx = 0;
        if (dist > lens[0] + lens[1]) { legIdx = 2; dist -= (lens[0] + lens[1]); }
        else if (dist > lens[0]) { legIdx = 1; dist -= lens[0]; }
        const pt = legs[legIdx].getPointAtLength(Math.min(dist, lens[legIdx]));
        ship.setAttribute("transform", `translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`);
        if (t < 1) triAnimFrame = requestAnimationFrame(frame);
        else triAnimFrame = null;
      }
      triAnimFrame = requestAnimationFrame(frame);
    }

            <div class="match-photos-grid">

    function measureWrappedLines(ctx, text, maxWidth) {
      const paragraphs = (text || "(Noch kein Tagebucheintrag)").split(/\r?\n/);
      const lines = [];
      for (const para of paragraphs) {
        const words = para.split(/\s+/).filter(Boolean);
        if (!words.length) { lines.push(""); continue; }
        let line = "";
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = w;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
      }
      return lines.length ? lines : ["(Noch kein Tagebucheintrag)"];
    }

    function downloadLernpassPNG() {
      const W = 1200;
      const padX = 44;
      const cardW = W - padX * 2;
      const textMaxW = cardW - 48;
      const lineH = 30;

      const done = getCompletedCount();
      const role = DIARY_ROLES[state.diaryRole] || DIARY_ROLES.potosi;
      const diaryBody = (state.diaryText || "").trim() || "(Noch kein Tagebucheintrag geschrieben)";

      const mc = document.createElement("canvas");
      const mctx = mc.getContext("2d");
      mctx.font = "20px Verdana, sans-serif";
      const bodyLines = measureWrappedLines(mctx, diaryBody, textMaxW);

      const diaryCardH = 74 + bodyLines.length * lineH + 28;
      const totalH = 124 + 98 + diaryCardH + 44;

      const sheet = document.createElement("canvas");
      sheet.width = W;
      sheet.height = totalH;
      const ctx = sheet.getContext("2d");

      ctx.fillStyle = "#FBF4E4";
      ctx.fillRect(0, 0, W, totalH);

      // Header
      ctx.fillStyle = "#15324D";
      ctx.fillRect(0, 0, W, 114);
      ctx.fillStyle = "#F4C552";
      ctx.fillRect(0, 110, W, 6);

      ctx.fillStyle = "#FFFDF8";
      ctx.font = "bold 28px Verdana, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Lernpass: Kolonien, Dreieckshandel & Sklaverei", 44, 50);

      ctx.fillStyle = "#FDF1CE";
      ctx.font = "19px Verdana, sans-serif";
      const nameTxt = state.studentName.trim() ? "Name: " + state.studentName.trim() : "1. Sekundarschule Niveau BC";
      ctx.fillText(nameTxt + "   •   Gelöste Kapitel: " + done + " / 8", 44, 84);

      // 8-Kapitel Status Strip
      const chipW = (cardW - 7 * 10) / 8;
      CHAPTER_META.forEach((ch, idx) => {
        const x = padX + idx * (chipW + 10);
        const y = 136;
        const ok = !!state.completed[ch.id];
        ctx.fillStyle = ok ? "#E2F5EA" : "#FFFDF8";
        ctx.strokeStyle = ok ? "#237A4B" : "#5C4E42";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.roundRect(x, y, chipW, 56, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = ok ? "#164F30" : "#5C4E42";
        ctx.font = "bold 15px Verdana, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText((ok ? "✓ " : "○ ") + "Kap. " + ch.id, x + chipW / 2, y + 34);
      });

      // Diary Card
      const cardY = 216;
      ctx.fillStyle = "#FFFDF8";
      ctx.strokeStyle = "#2A2018";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(padX, cardY, cardW, diaryCardH, 18);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.fillStyle = "#B8402C";
      ctx.font = "bold 21px Verdana, sans-serif";
      ctx.fillText("Tagebucheintrag (Kapitel 5) – " + role.label, padX + 24, cardY + 38);

      ctx.strokeStyle = "#EADBC0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padX + 24, cardY + 54);
      ctx.lineTo(padX + cardW - 24, cardY + 54);
      ctx.stroke();

      ctx.fillStyle = "#221A14";
      ctx.font = "20px Verdana, sans-serif";
      let ty = cardY + 86;
      for (const bl of bodyLines) {
        ctx.fillText(bl, padX + 24, ty);
        ty += lineH;
      }

      const a = document.createElement("a");
      a.href = sheet.toDataURL("image/png");
      a.download = "Entdeckungen_Kolonien_Lernpass.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      const toast = document.getElementById("copy-toast");
      if (toast) toast.textContent = "✅ Dein Lernpass wurde als PNG heruntergeladen!";
    }
