<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entdeckungen: Christoph Kolumbus – Comic-Lernpfad</title>
  <style>
    :root {
      --ocean-deep: #15324D;
      --ocean-mid: #1F4E78;
      --ocean-light: #D9EEF8;
      --parchment: #FBF4E4;
      --parchment-card: #FFFDF8;
      --parchment-dark: #EADBC0;
      --gold: #D49B35;
      --gold-bright: #F4C552;
      --gold-soft: #FDF1CE;
      --spice-red: #B8402C;
      --spice-soft: #FDECE8;
      --emerald: #237A4B;
      --emerald-soft: #E2F5EA;
      --ink: #221A14;
      --ink-muted: #5C4E42;
      --kolumbus-blue: #1D6FD8;
      --vespucci-teal: #0F766E;
      --border-comic: #2A2018;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 56px 0;
      background-color: var(--parchment);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(212, 155, 53, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, rgba(31, 78, 120, 0.10) 0%, transparent 50%);
      color: var(--ink);
      font-family: Verdana, 'Trebuchet MS', system-ui, -apple-system, sans-serif;
      font-size: calc(18px * var(--font-scale));
      line-height: 1.6;
      min-height: 100vh;
    }

    .font-title {
      font-family: 'Trebuchet MS', Verdana, system-ui, sans-serif;
      letter-spacing: 0.01em;
    }

    /* ================= TOP HEADER ================= */
    .top-header {
      background: linear-gradient(135deg, var(--ocean-deep) 0%, var(--ocean-mid) 100%);
      color: #FFFDF8;
      border-bottom: 4px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 4px 16px rgba(21, 50, 77, 0.22);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--gold-bright);
      color: var(--ink);
      border: 2.5px solid var(--border-comic);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 2px 2px 0 var(--border-comic);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--gold-soft);
      opacity: 0.95;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-link-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFDF8;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 6px 13px;
      min-height: 40px;
      font-size: 0.84rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.15s ease;
    }

    .header-link-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .pill-stat {
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid var(--gold-bright);
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= PROGRESS STEPPER ================= */
    .stepper-bar {
      background: var(--parchment-dark);
      border-top: 1px solid rgba(42, 32, 24, 0.15);
    }

    .stepper-scroll {
      max-width: 980px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .step-chip {
      border: 2px solid var(--border-comic);
      background: var(--parchment-card);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background-color 0.15s ease;
      font-family: inherit;
      min-height: 40px;
    }

    .step-chip:hover {
      transform: translateY(-1px);
      background: var(--gold-soft);
    }

    .step-chip.active {
      background: var(--gold-bright);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--border-comic);
    }

    .step-chip.done {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #164F30;
    }

    /* ================= MAIN LAYOUT ================= */
    .main-wrap {
      max-width: 940px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .comic-panel {
      background: var(--parchment-card);
      border: 3px solid var(--border-comic);
      border-radius: var(--radius-lg);
      box-shadow: 5px 5px 0 rgba(42, 32, 24, 0.18);
      padding: 20px;
      margin-bottom: 18px;
    }

    @media (min-width: 640px) {
      .comic-panel {
        padding: 26px;
      }
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ocean-mid);
      color: #FFFDF8;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid var(--border-comic);
    }

    .chapter-heading {
      margin: 10px 0 6px;
      font-size: 1.5rem;
      line-height: 1.25;
      color: var(--ocean-deep);
    }

    /* ================= BUTTONS ================= */
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.96rem;
      border-radius: var(--radius-md);
      border: 2.5px solid var(--border-comic);
      padding: 11px 17px;
      min-height: 48px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      text-decoration: none;
      touch-action: manipulation;
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--ocean-mid);
      color: #FFFDF8;
      box-shadow: 3px 3px 0 var(--border-comic);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ocean-deep);
    }

    .btn-gold {
      background: var(--gold-bright);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--border-comic);
    }

    .btn-gold:hover:not(:disabled) {
      background: #F7D170;
    }

    .btn-soft {
      background: var(--parchment);
      color: var(--ink);
      box-shadow: 2px 2px 0 rgba(42, 32, 24, 0.2);
    }

    .btn-soft:hover:not(:disabled) {
      background: var(--parchment-dark);
    }

    .btn-sm {
      min-height: 40px;
      padding: 6px 12px;
      font-size: 0.84rem;
      border-radius: 10px;
    }

    .btn-speak {
      background: var(--gold-soft);
      color: var(--ink);
      border: 2px solid var(--border-comic);
      border-radius: 999px;
      padding: 6px 13px;
      min-height: 40px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn-speak:hover {
      background: var(--gold-bright);
    }

    .btn-speak.speaking-active {
      background: var(--spice-red);
      color: #FFFDF8;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    /* ================= OVERVIEW MAP (STEP 0) ================= */
    .overview-hero {
      background: linear-gradient(135deg, #FFFDF8 0%, #FDF4DC 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .map-frame {
      background: linear-gradient(180deg, #E8F4FA 0%, #D9EEF8 100%);
      border: 3px solid var(--border-comic);
      border-radius: 18px;
      padding: 12px;
      box-shadow: inset 0 0 24px rgba(21, 50, 77, 0.10);
      margin-bottom: 14px;
    }

    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 248, 0.9);
      border: 1.5px solid var(--border-comic);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .legend-line {
      width: 20px;
      height: 4px;
      border-radius: 2px;
      display: inline-block;
    }

    .overview-map-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2.5px solid var(--border-comic);
      background: #B9DCF0;
      box-shadow: 0 4px 14px rgba(21, 50, 77, 0.14);
    }

    .overview-map-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .overview-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-pin-btn {
      cursor: pointer;
    }

    .map-pin-btn circle.pin-bg {
      transition: transform 0.15s ease, fill 0.15s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .map-pin-btn:hover circle.pin-bg {
      transform: scale(1.14);
    }

    .pin-detail-card {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 15px 18px;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.14);
      margin-bottom: 16px;
    }

    .roadmap-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    @media (min-width: 680px) {
      .roadmap-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .roadmap-card {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: inherit;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .roadmap-card:hover {
      background: var(--gold-soft);
      transform: translateY(-2px);
    }

    .roadmap-card.done {
      background: var(--emerald-soft);
      border-color: var(--emerald);
    }

    /* ================= COMIC STAGE & BUBBLES ================= */
    .comic-stage {
      background: linear-gradient(180deg, #E3F2FA 0%, #FBF4E4 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px;
      margin: 14px 0 16px;
      position: relative;
      overflow: hidden;
    }

    .comic-stage.warm-bg {
      background: linear-gradient(180deg, #FDF1CE 0%, #FBF4E4 100%);
    }

    .comic-stage.serious-bg {
      background: linear-gradient(180deg, #FDECE8 0%, #FBF4E4 100%);
    }

    .stage-scene {
      padding: 6px 4px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: center;
    }

    @media (min-width: 700px) {
      .stage-scene {
        grid-template-columns: 225px 1fr;
        padding: 8px 6px;
      }
    }

    .cast-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .char-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .char-box svg {
      width: 92px;
      height: 100px;
      display: block;
    }

    .char-name-tag {
      margin-top: 4px;
      background: var(--ink);
      color: #FFFDF8;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .anim-bob-delay {
      animation: floatBob 3.4s ease-in-out 0.7s infinite;
    }

    .dialogue-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .speech-bubble {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 12px 15px;
      position: relative;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .speech-bubble.narrator {
      background: var(--gold-soft);
      border-style: dashed;
    }

    .speech-bubble.kolumbus {
      border-left: 7px solid var(--kolumbus-blue);
    }

    .speech-bubble.seefahrer {
      border-left: 7px solid var(--spice-red);
    }

    .speech-bubble.koenigspaar {
      border-left: 7px solid var(--gold);
    }

    .speech-bubble.taino {
      border-left: 7px solid var(--emerald);
    }

    .speech-bubble.vespucci {
      border-left: 7px solid var(--vespucci-teal);
    }

    .speech-bubble.speaking {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(244, 197, 82, 0.55);
    }

    .speech-speaker {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ocean-mid);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speech-text {
      margin: 0;
      font-size: 1rem;
    }

    .term-btn {
      background: var(--gold-bright);
      color: var(--ink);
      border: 1.5px solid var(--border-comic);
      border-radius: 7px;
      padding: 1px 7px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.94em;
      cursor: pointer;
      display: inline-block;
      line-height: 1.35;
    }

    .term-btn:hover {
      background: #FFE082;
    }

    /* ================= HISTORICAL SOURCES & LIGHTBOX ================= */
    .sources-box {
      background: linear-gradient(135deg, #FBF4E4 0%, #F5E9D0 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px 16px;
      margin: 14px 0;
    }

    .sources-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--ocean-deep);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .source-card {
      background: var(--parchment-card);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
    }

    .source-img-btn {
      padding: 0;
      border: none;
      background: #221A14;
      cursor: pointer;
      position: relative;
      display: block;
      width: 100%;
      height: 190px;
      overflow: hidden;
    }

    .source-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
      transition: transform 0.2s ease;
    }

    .source-img-btn:hover img {
      transform: scale(1.04);
    }

    .source-zoom-pill {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(255, 253, 248, 0.94);
      color: var(--ink);
      border: 1.5px solid var(--border-comic);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.76rem;
      font-weight: 800;
      font-family: inherit;
    }

    .source-meta {
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .source-caption {
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--ocean-deep);
      line-height: 1.3;
    }

    .source-credit {
      font-size: 0.76rem;
      color: var(--ink-muted);
    }

    .source-hint {
      margin: 4px 0 0;
      font-size: 0.86rem;
      line-height: 1.45;
      color: var(--ink);
    }

    /* ================= INTERACTIVE ENGRAVING (CHAPTER 4) ================= */
    .engraving-card {
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 15px;
      background: linear-gradient(135deg, #FBF4E4 0%, #F5E9D0 100%);
      margin: 14px 0;
    }

    .engraving-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2.5px solid var(--border-comic);
      margin-top: 10px;
      background: #221A14;
    }

    .engraving-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 3px solid #FFFDF8;
      background: var(--spice-red);
      color: #FFFDF8;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .hotspot-btn:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .hotspot-btn.active {
      background: var(--gold-bright);
      color: var(--ink);
      border-color: var(--border-comic);
      transform: translate(-50%, -50%) scale(1.16);
    }

    .hotspot-info {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--parchment-card);
      border: 2px solid var(--gold);
    }

    /* ================= INTERACTION / QUIZ / DETAILS ================= */
    .interaction-box {
      background: var(--ocean-light);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      background: var(--parchment-card);
      border: 2px solid var(--border-comic);
      border-radius: 12px;
      padding: 12px 15px;
      min-height: 48px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .quiz-option:hover {
      background: var(--gold-soft);
      transform: translateY(-1px);
    }

    .quiz-option.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .quiz-option.wrong {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    .feedback-banner {
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      margin-top: 10px;
      border: 2px solid;
    }

    .feedback-banner.ok {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .feedback-banner.retry {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    details.onenote-ref {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 10px 14px;
      margin: 14px 0;
    }

    details.onenote-ref summary {
      cursor: pointer;
      font-weight: 800;
      color: var(--ocean-deep);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
    }

    details.onenote-ref summary::-webkit-details-marker {
      display: none;
    }

    .onenote-original-text {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1.5px dashed rgba(42, 32, 24, 0.25);
      font-size: 0.94rem;
      color: var(--ink);
    }

    /* ================= ONENOTE ASSIGNMENTS A-D ================= */
    .onenote-card {
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px;
      background: var(--parchment-card);

    /* ================= ANIMATIONS ================= */
    @keyframes floatBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes shipRock {
      0%, 100% { transform: rotate(-1.5deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-3px); }
    }

    .anim-bob {
      animation: floatBob 3s ease-in-out infinite;
    }

    .anim-ship {
      transform-box: fill-box;
      transform-origin: center;
      animation: shipRock 3.6s ease-in-out infinite;
    }

        animation: none !important;
      }
      * {
        transition: none !important;
      }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRichText(raw) {
      return escapeHtml(raw).replace(/\{\{(\w+)\}\}/g, (_, key) => {
        const entry = GLOSSARY[key];
        if (!entry) return key;
        return `<button type="button" class="term-btn" onclick="openSingleTerm('${key}')">${entry.word}</button>`;
      });
    }

    function stripTokensForSpeech(raw) {
      return raw.replace(/\{\{(\w+)\}\}/g, (_, key) => GLOSSARY[key] ? GLOSSARY[key].word : key);
    }

    function updateFontLabel() {
      const el = document.getElementById("fontLabel");
      if (!el) return;

    function animateOverviewShip() {
      const shipEl = document.getElementById("overview-ship");
      const pathEl = document.getElementById("kolumbus-route-path");
      if (!shipEl || !pathEl) return;

      if (voyageAnimFrame) cancelAnimationFrame(voyageAnimFrame);
      const totalLen = pathEl.getTotalLength();
      const duration = 3400;
      const start = performance.now();

      function frame(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / duration);
        const pt = pathEl.getPointAtLength(t * totalLen);
        shipEl.setAttribute("transform", `translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`);
        if (t < 1) {
          voyageAnimFrame = requestAnimationFrame(frame);
        } else {
          voyageAnimFrame = null;
        }
      }
      voyageAnimFrame = requestAnimationFrame(frame);
    }

        return `<button type="button" class="${cls}" onclick="answerChapterQuiz(${chId}, ${oIdx})"><span>${icon}</span> <span>${opt}</span></button>`;
      }).join("");

      let feedbackHtml = "";
      if (answered !== undefined) {
        if (answered === ch.quiz.correct) {
          feedbackHtml = `<div class="feedback-banner ok">⭐ ${ch.quiz.okMsg}</div>`;

    function answerChapterQuiz(chId, optIdx) {
      state.quizAnswers[chId] = optIdx;
      if (optIdx === STORY_CHAPTERS[chId].quiz.correct) {
        state.completed[chId] = true;
      }
      saveState();
      render();
    }

    // =========================================================================
    // 16. AUFTRÄGE A–D FÜR ONENOTE (SCHRITT 7)
    // =========================================================================
    function renderAssignmentsScreen() {
      const doneCount = [1, 2, 3, 4, 5, 6].filter(id => !!state.completed[id]).length;

      const cardsHtml = ASSIGNMENTS.map(a => `
        <article class="onenote-card">
          <div class="onenote-head">
            <div style="display:flex; align-items:flex-start; gap:12px; flex:1;">
              <span class="letter-badge">${a.letter}</span>
              <h3 style="margin:0; font-size:1.08rem; font-weight:800; color:var(--ocean-deep);">${a.question}</h3>
            </div>
            <button type="button" class="btn-speak" data-speech="${escapeHtml(a.readText)}" onclick="speakFromBtn(this)">
              🔊 Vorlesen
            </button>
          </div>

          <div class="helper-row">
            <button type="button" class="btn btn-gold btn-sm" onclick="toggleHelper('tip-${a.letter}', this)" aria-expanded="false">
              💡 Tipp anzeigen
            </button>
            <button type="button" class="btn btn-soft btn-sm" onclick="toggleHelper('starter-${a.letter}', this)" aria-expanded="false">
              ✍️ Satzstarter &amp; Wörter
            </button>
          </div>

          <div id="tip-${a.letter}" class="helper-panel">
            <strong>💡 Tipp für deinen Text in OneNote:</strong>
            <p style="margin:6px 0 0 0; font-size:0.94rem;">${a.tip}</p>
          </div>

          <div id="starter-${a.letter}" class="helper-panel" style="background:var(--ocean-light); border-color:var(--ocean-mid);">
            <strong>✍️ So kannst du deine Sätze anfangen:</strong>
            <ul style="margin:6px 0 10px 1.2rem; padding:0; font-size:0.94rem;">
              ${a.starters.map(s => `<li style="margin-bottom:4px;">${s}</li>`).join("")}
            </ul>
            <strong>🧩 Nützliche Wörter:</strong>
            <div class="word-chips">
              ${a.words.map(w => `<span class="word-chip">${w}</span>`).join("")}
            </div>
          </div>

          ${a.hasChecklist ? `
            <div style="margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--gold-soft); border:2px solid var(--gold);">
              <strong>✅ Checkliste für Auftrag C (in OneNote geschrieben?):</strong>
              <label class="checklist-item">
                <input type="checkbox" ${state.checklistC[0] ? "checked" : ""} onchange="toggleChecklist(0, this.checked)">
                <span>1. Beschrieben, was am Strand/Meer passiert?</span>
              </label>
              <label class="checklist-item">
                <input type="checkbox" ${state.checklistC[1] ? "checked" : ""} onchange="toggleChecklist(1, this.checked)">
                <span>2. Aus der Sicht eines Haitianers («Ich» / «Wir») erzählt?</span>
              </label>
              <label class="checklist-item">
                <input type="checkbox" ${state.checklistC[2] ? "checked" : ""} onchange="toggleChecklist(2, this.checked)">
                <span>3. Mindestens 3 ganze Sätze geschrieben?</span>
              </label>
            </div>` : ""}
        </article>
      `).join("");

      return `
        <section class="comic-panel">
          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px;">
            <span class="chapter-badge">Abschluss • Dein OneNote-Auftrag</span>
            <span style="font-weight:800; color:var(--emerald);">⭐ ${doneCount} / 6 Mini-Checks gelöst</span>
          </div>
          <h2 class="chapter-heading font-title">Aufträge A bis D für dein OneNote</h2>

          <div class="interaction-box" style="background:var(--gold-soft);">
            <strong>📱 So arbeitest du jetzt weiter:</strong>
            <p style="margin:4px 0 0 0; font-size:0.95rem;">
              Öffne <strong>OneNote</strong> auf deinem iPad (am besten im geteilten Bildschirm neben dieser Seite) und schreibe dort deine Antworten zu <strong>A, B, C und D</strong>. Nutze hier die <strong>Tipps</strong> und <strong>Satzstarter</strong>, wenn du Hilfe brauchst!
            </p>
          </div>

          ${cardsHtml}

          <div class="nav-footer">
            <button type="button" class="btn btn-soft" onclick="goToStep(6)">
              ◀ Zurück zu Kapitel 6
            </button>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn btn-soft" onclick="resetAllProgress()">
                🔄 Zurücksetzen
              </button>
              <button type="button" class="btn btn-gold" onclick="goToStep(0)">
                🗺️ Zur Übersichtskarte
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function toggleHelper(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const open = el.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function toggleChecklist(idx, val) {
      state.checklistC[idx] = val;
      saveState();
    }

    // =========================================================================
    // 17. GLOSSAR-DIALOG
    // =========================================================================
    const glossaryDialog = document.getElementById("glossary-dialog");
    const glossTitle = document.getElementById("gloss-title");
    const glossBody = document.getElementById("gloss-body");

    function openSingleTerm(key) {
      const item = GLOSSARY[key];
      if (!item) return;
      glossTitle.textContent = `📖 Begriff: ${item.word}`;
      glossBody.innerHTML = `
        <div style="font-size:0.9rem; font-weight:800; color:var(--spice-red); margin-bottom:4px;">${item.short}</div>
        <p style="font-size:1.08rem; margin:0 0 14px 0;">${item.text}</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between;">
          <button type="button" class="btn-speak" data-speech="${escapeHtml(item.word + ": " + item.text)}" onclick="speakFromBtn(this)">
            🔊 Erklärung vorlesen
          </button>
          <button type="button" class="btn btn-soft btn-sm" onclick="openGlossaryModal()">
            Alle Wörter ansehen
          </button>
        </div>
      `;
      if (!glossaryDialog.open) glossaryDialog.showModal();
    }

    function openGlossaryModal() {
      glossTitle.textContent = "📖 Alle wichtigen Wörter";
      glossBody.innerHTML = Object.values(GLOSSARY).map(item => `
        <div style="border-bottom:1.5px solid rgba(42,32,24,0.18); padding:10px 0;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong style="font-size:1.05rem;">${item.word}</strong>
            <button type="button" class="btn-speak" style="min-height:34px; padding:4px 10px;" data-speech="${escapeHtml(item.word + ": " + item.text)}" onclick="speakFromBtn(this)">🔊</button>
          </div>
          <div style="font-size:0.85rem; color:var(--spice-red); font-weight:700;">${item.short}</div>
          <p style="margin:4px 0 0 0; font-size:0.95rem;">${item.text}</p>
        </div>
      `).join("");
      if (!glossaryDialog.open) glossaryDialog.showModal();
    }

    function closeGlossary() {
      stopSpeech();
      if (glossaryDialog.open) glossaryDialog.close();
    }

    glossaryDialog.addEventListener("click", e => {
      if (e.target === glossaryDialog) closeGlossary();
    });

    document.getElementById("source-dialog").addEventListener("click", e => {
      if (e.target === document.getElementById("source-dialog")) closeSourceModal();
    });

    // =========================================================================
    // 18. VORLESEFUNKTION (WEB SPEECH API)
    // =========================================================================
    let cachedVoice = null;

    function pickGermanVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      return (
        voices.find(v => v.lang.toLowerCase().startsWith("de-ch")) ||
        voices.find(v => v.lang.toLowerCase().startsWith("de")) ||
        null
      );
    }

    if ("speechSynthesis" in window) {
      cachedVoice = pickGermanVoice();
      window.speechSynthesis.onvoiceschanged = () => {
        cachedVoice = pickGermanVoice();
      };
    }

    function clearSpeechUI() {
      document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
      if (activeSpeakBtn) {
        activeSpeakBtn.classList.remove("speaking-active");
        if (activeSpeakBtn.dataset.origLabel) {
          activeSpeakBtn.textContent = activeSpeakBtn.dataset.origLabel;
        }
      }
      activeSpeakBtn = null;
      const globalBtn = document.getElementById("global-speak-btn");
      const globalLabel = document.getElementById("speak-label");
      if (globalBtn) globalBtn.classList.remove("speaking-active");
      if (globalLabel) globalLabel.textContent = "Vorlesen";
    }

    function stopSpeech() {
      readingSequenceCancelled = true;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      clearSpeechUI();
    }

    function speakText(text, btnEl = null, highlightEl = null) {
      if (!("speechSynthesis" in window)) {
        alert("Dein Browser unterstützt leider keine Sprachausgabe.");
        return;
      }
      const isSameBtn = btnEl && activeSpeakBtn === btnEl && window.speechSynthesis.speaking;
      stopSpeech();
      if (isSameBtn) return;

      readingSequenceCancelled = false;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "de-CH";
      utter.rate = 0.94;
      if (cachedVoice) utter.voice = cachedVoice;

      if (highlightEl) highlightEl.classList.add("speaking");
      if (btnEl) {
        btnEl.dataset.origLabel = btnEl.textContent.trim();
        btnEl.classList.add("speaking-active");
        btnEl.textContent = "⏹ Stopp";
        activeSpeakBtn = btnEl;
      }

      utter.onend = clearSpeechUI;
      utter.onerror = clearSpeechUI;
      window.speechSynthesis.speak(utter);
    }

    function speakFromBtn(btnEl) {
      speakText(btnEl.dataset.speech || "", btnEl);
    }

    function speakPanel(chId, panelIdx, btnEl) {
      const ch = STORY_CHAPTERS[chId];
      if (!ch || !ch.panels[panelIdx]) return;
      const box = document.getElementById(`panel-${panelIdx}`);
      const text = stripTokensForSpeech(ch.panels[panelIdx].text);
      speakText(text, btnEl, box);
    }

    function speakCurrentSection() {
      if (!("speechSynthesis" in window)) {
        alert("Dein Browser unterstützt leider keine Sprachausgabe.");
        return;
      }
      const globalBtn = document.getElementById("global-speak-btn");
      const globalLabel = document.getElementById("speak-label");
      if (window.speechSynthesis.speaking && !readingSequenceCancelled && globalBtn.classList.contains("speaking-active")) {
        stopSpeech();
        return;
      }

      stopSpeech();

      if (state.currentStep === 0) {
        const st = MAP_STATIONS.find(s => s.id === state.selectedPin) || MAP_STATIONS[0];
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        speakText(`Übersichtskarte zu Christoph Kolumbus. ${st.title}. ${st.desc}`);
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      if (state.currentStep === 7) {
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        speakText("Aufträge A bis D für dein OneNote. Öffne OneNote im geteilten Bildschirm und nutze die Tipps und Satzstarter bei jedem Auftrag.");
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      const ch = STORY_CHAPTERS[state.currentStep];
      if (!ch) return;

      readingSequenceCancelled = false;
      globalBtn.classList.add("speaking-active");
      globalLabel.textContent = "Stopp";

      let idx = 0;
      function nextPanel() {
        if (readingSequenceCancelled || idx >= ch.panels.length) {
          clearSpeechUI();
          return;
        }
        const panel = ch.panels[idx];
        const box = document.getElementById(`panel-${idx}`);
        document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
        if (box) box.classList.add("speaking");

        const utter = new SpeechSynthesisUtterance(stripTokensForSpeech(panel.text));
        utter.lang = "de-CH";
        utter.rate = 0.94;
        if (cachedVoice) utter.voice = cachedVoice;

        utter.onend = () => {
          idx++;
          nextPanel();
        };
        utter.onerror = clearSpeechUI;
        window.speechSynthesis.speak(utter);
      }

      nextPanel();
    }

    // =========================================================================
    // 19. HAUPT-RENDER
    // =========================================================================
    function render() {
      renderHeaderStats();
      renderStepper();
      const main = document.getElementById("app-main");
      if (state.currentStep === 0) {
        main.innerHTML = renderOverviewScreen();
      } else if (state.currentStep === 7) {
        main.innerHTML = renderAssignmentsScreen();
      } else {
        main.innerHTML = renderStoryChapter(state.currentStep);
      }
    }

    loadState();
    render();
  </script>
</body>
</html>
