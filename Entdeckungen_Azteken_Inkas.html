<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entdeckungen: Azteken, Inkas &amp; die Spanier – Comic-Abenteuer</title>
  <style>
    :root {
      --ocean-deep: #15324D;
      --ocean-mid: #1F4E78;
      --ocean-light: #D9EEF8;
      --parchment: #FBF4E4;
      --parchment-card: #FFFDF8;
      --parchment-dark: #EADBC0;
      --gold: #D49B35;
      --gold-bright: #F4C552;
      --gold-soft: #FDF1CE;
      --spice-red: #B8402C;
      --spice-soft: #FDECE8;
      --emerald: #237A4B;
      --emerald-soft: #E2F5EA;
      --ink: #221A14;
      --ink-muted: #5C4E42;
      --aztec-blue: #1D6FD8;
      --inca-green: #1B8A4B;
      --border-comic: #2A2018;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 56px 0;
      background-color: var(--parchment);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(212, 155, 53, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, rgba(31, 78, 120, 0.10) 0%, transparent 50%);
      color: var(--ink);
      font-family: Verdana, 'Trebuchet MS', system-ui, -apple-system, sans-serif;
      font-size: calc(18px * var(--font-scale));
      line-height: 1.6;
      min-height: 100vh;
    }

    .font-title {
      font-family: 'Trebuchet MS', Verdana, system-ui, sans-serif;
      letter-spacing: 0.01em;
    }

    /* ================= TOP HEADER ================= */
    .top-header {
      background: linear-gradient(135deg, var(--ocean-deep) 0%, var(--ocean-mid) 100%);
      color: #FFFDF8;
      border-bottom: 4px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 4px 16px rgba(21, 50, 77, 0.22);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--gold-bright);
      color: var(--ink);
      border: 2.5px solid var(--border-comic);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 2px 2px 0 var(--border-comic);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--gold-soft);
      opacity: 0.95;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-link-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFDF8;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 6px 13px;
      min-height: 40px;
      font-size: 0.84rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }

    .header-link-btn:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .pill-stat {
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid var(--gold-bright);
      border-radius: 999px;
      padding: 6px 12px;
      min-height: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= PROGRESS STEPPER ================= */
    .stepper-bar {
      background: var(--parchment-dark);
      border-top: 1px solid rgba(42, 32, 24, 0.15);
    }

    .stepper-scroll {
      max-width: 980px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .step-chip {
      border: 2px solid var(--border-comic);
      background: var(--parchment-card);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background-color 0.15s ease;
      font-family: inherit;
      min-height: 40px;
      touch-action: manipulation;
    }

    .step-chip:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--gold-soft);
    }

    .step-chip.active {
      background: var(--gold-bright);
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--border-comic);
    }

    .step-chip.done {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #164F30;
    }

    .step-chip:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-style: dashed;
    }

    /* ================= MAIN LAYOUT ================= */
    .main-wrap {
      max-width: 940px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .comic-panel {
      background: var(--parchment-card);
      border: 3px solid var(--border-comic);
      border-radius: var(--radius-lg);
      box-shadow: 5px 5px 0 rgba(42, 32, 24, 0.18);
      padding: 20px;
      margin-bottom: 18px;
    }

    @media (min-width: 640px) {
      .comic-panel {
        padding: 26px;
      }
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ocean-mid);
      color: #FFFDF8;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid var(--border-comic);
    }

    .chapter-heading {
      margin: 10px 0 6px;
      font-size: 1.48rem;
      line-height: 1.25;
      color: var(--ocean-deep);
    }

    /* ================= BUTTONS ================= */
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.96rem;
      border-radius: var(--radius-md);
      border: 2.5px solid var(--border-comic);
      padding: 11px 17px;
      min-height: 48px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      text-decoration: none;
      touch-action: manipulation;
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--ocean-mid);
      color: #FFFDF8;
      box-shadow: 3px 3px 0 var(--border-comic);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--ocean-deep);
    }

    .btn-gold {
      background: var(--gold-bright);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--border-comic);
    }
    .btn-gold:hover:not(:disabled) {
      background: #F7D170;
    }

    .btn-emerald {
      background: var(--emerald);
      color: #FFFDF8;
      box-shadow: 3px 3px 0 var(--border-comic);
    }
    .btn-emerald:hover:not(:disabled) {
      background: #1B623B;
    }

    .btn-soft {
      background: var(--parchment);
      color: var(--ink);
      box-shadow: 2px 2px 0 rgba(42, 32, 24, 0.2);
    }
    .btn-soft:hover:not(:disabled) {
      background: var(--parchment-dark);
    }

    .btn-sm {
      min-height: 40px;
      padding: 6px 12px;
      font-size: 0.84rem;
      border-radius: 10px;
    }

    .btn-speak {
      background: var(--gold-soft);
      color: var(--ink);
      border: 2px solid var(--border-comic);
      border-radius: 999px;
      padding: 6px 13px;
      min-height: 40px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .btn-speak:hover {
      background: var(--gold-bright);
    }

    .btn-speak.speaking-active {
      background: var(--spice-red);
      color: #FFFDF8;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    /* ================= OVERVIEW MAP (STEP 0) ================= */
    .overview-hero {
      background: linear-gradient(135deg, #FFFDF8 0%, #FDF4DC 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .map-frame {
      background: linear-gradient(180deg, #E8F4FA 0%, #D9EEF8 100%);
      border: 3px solid var(--border-comic);
      border-radius: 18px;
      padding: 12px;
      box-shadow: inset 0 0 24px rgba(21, 50, 77, 0.10);
      margin-bottom: 14px;
    }

    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 248, 0.94);
      border: 1.5px solid var(--border-comic);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid var(--border-comic);
      display: inline-block;
    }

    .legend-line {
      width: 20px;
      height: 4px;
      border-radius: 2px;
      display: inline-block;
    }

    .overview-map-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2.5px solid var(--border-comic);
      background: #B9DCF0;
      box-shadow: 0 4px 14px rgba(21, 50, 77, 0.14);
    }

    .overview-map-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .overview-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-pin-btn {
      cursor: pointer;
    }

    .map-pin-btn circle.pin-bg {
      transition: transform 0.15s ease, fill 0.15s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .map-pin-btn:hover circle.pin-bg {
      transform: scale(1.14);
    }

    /* Schweiz Grössenvergleich */
    .swiss-compare-box {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 15px 18px;
      margin-bottom: 16px;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
    }

    .size-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-top: 10px;
    }

    @media (min-width: 640px) {
      .size-row {
        grid-template-columns: 220px 1fr;
        align-items: center;
        gap: 12px;
      }
    }

    .size-track {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 999px;
      height: 26px;
      padding: 3px;
      display: flex;
      align-items: center;
    }

    .size-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .pin-detail-card {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 15px 18px;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.14);
      margin-bottom: 16px;
    }

    .roadmap-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    @media (min-width: 680px) {
      .roadmap-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .roadmap-card {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: inherit;
      touch-action: manipulation;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .roadmap-card:hover:not(:disabled) {
      background: var(--gold-soft);
      transform: translateY(-2px);
    }

    .roadmap-card.done {
      background: var(--emerald-soft);
      border-color: var(--emerald);
    }

    .roadmap-card:disabled {
      opacity: 0.56;
      cursor: not-allowed;
      border-style: dashed;
    }

    /* ================= COMIC STAGE & BUBBLES ================= */
    .comic-stage {
      background: linear-gradient(180deg, #E3F2FA 0%, #FBF4E4 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px;
      margin: 14px 0 16px;
      position: relative;
      overflow: hidden;
    }

    .comic-stage.warm-bg {
      background: linear-gradient(180deg, #FDF1CE 0%, #FBF4E4 100%);
    }

    .comic-stage.andes-bg {
      background: linear-gradient(180deg, #E2F5EA 0%, #FBF4E4 100%);
    }

    .comic-stage.serious-bg {
      background: linear-gradient(180deg, #FDECE8 0%, #FBF4E4 100%);
    }

    .stage-scene {
      padding: 6px 4px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: center;
    }

    @media (min-width: 720px) {
      .stage-scene {
        grid-template-columns: 260px 1fr;
        padding: 8px 6px;
      }
    }

    .cast-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .char-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .char-box svg {
      display: block;
    }

    .char-name-tag {
      margin-top: 4px;
      background: var(--ink);
      color: #FFFDF8;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .dialogue-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .speech-bubble {
      background: #FFFDF8;
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 12px 15px;
      position: relative;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .speech-bubble.timo {
      background: #F4FAFF;
      border-left: 7px solid var(--ocean-mid);
    }

    .speech-bubble.koko {
      background: #FFF9E6;
      border-left: 7px solid var(--gold);
    }

    .speech-bubble.aztekin,
    .speech-bubble.moctezuma {
      border-left: 7px solid var(--aztec-blue);
    }

    .speech-bubble.inka,
    .speech-bubble.atahualpa {
      border-left: 7px solid var(--inca-green);
    }

    .speech-bubble.cortes,
    .speech-bubble.pizarro {
      border-left: 7px solid var(--spice-red);
    }

    .speech-bubble.narrator {
      background: var(--gold-soft);
      border-style: dashed;
    }

    .speech-bubble.speaking {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(244, 197, 82, 0.55);
    }

    .speech-speaker {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ocean-mid);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .speech-text {
      margin: 0;
      font-size: 1rem;
    }

    .term-btn {
      background: var(--gold-bright);
      color: var(--ink);
      border: 1.5px solid var(--border-comic);
      border-radius: 7px;
      padding: 1px 7px;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.94em;
      cursor: pointer;
      display: inline-block;
      line-height: 1.35;
      touch-action: manipulation;
    }

    .term-btn:hover {
      background: #FFE082;
    }

    /* ================= HISTORICAL IMAGE SOURCE (1 PER CHAPTER) ================= */
    .sources-box {
      background: linear-gradient(135deg, #FBF4E4 0%, #F5E9D0 100%);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 14px 16px;
      margin: 14px 0;
    }

    .sources-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--ocean-deep);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .source-card-single {
      background: var(--parchment-card);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      box-shadow: 3px 3px 0 rgba(42, 32, 24, 0.12);
    }

    @media (min-width: 680px) {
      .source-card-single {
        grid-template-columns: 320px 1fr;
      }
    }

    .source-img-btn {
      padding: 0;
      border: none;
      background: #221A14;
      cursor: pointer;
      position: relative;
      display: block;
      width: 100%;
      min-height: 210px;
      max-height: 260px;
      overflow: hidden;
    }

    .source-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
      transition: transform 0.2s ease;
    }

    .source-img-btn:hover img {
      transform: scale(1.04);
    }

    .source-zoom-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(255, 253, 248, 0.95);
      color: var(--ink);
      border: 1.5px solid var(--border-comic);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.78rem;
      font-weight: 800;
      font-family: inherit;
    }

    .source-meta {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .source-caption {
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--ocean-deep);
      line-height: 1.3;
    }

    .source-credit {
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    .source-hint {
      margin: 4px 0 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--ink);
    }

    /* ================= INTERACTION / QUIZ / DETAILS ================= */
    .interaction-box {
      background: var(--ocean-light);
      border: 2.5px solid var(--border-comic);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      background: var(--parchment-card);
      border: 2px solid var(--border-comic);
      border-radius: 12px;
      padding: 12px 15px;
      min-height: 48px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .quiz-option:hover {
      background: var(--gold-soft);
      transform: translateY(-1px);
    }

    .quiz-option.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .quiz-option.wrong {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    .feedback-banner {
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      margin-top: 10px;
      border: 2px solid;
    }

    .feedback-banner.ok {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #124026;
    }

    .feedback-banner.retry {
      background: var(--spice-soft);
      border-color: var(--spice-red);
      color: #7D1F11;
    }

    details.onenote-ref {
      background: var(--parchment);
      border: 2px solid var(--border-comic);
      border-radius: 14px;
      padding: 10px 14px;
      margin: 14px 0;
    }

    details.onenote-ref summary {
      cursor: pointer;
      font-weight: 800;
      color: var(--ocean-deep);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
    }

    details.onenote-ref summary::-webkit-details-marker {
      display: none;
    }

    .onenote-original-text {
      margin-top: 10px;
      padding-top: 10px;

      margin-top: 18px;

    /* ================= ANIMATIONS ================= */
    @keyframes comicBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }

    @keyframes parrotHop {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      45% { transform: translateY(-7px) rotate(3deg); }
      65% { transform: translateY(-2px) rotate(-1deg); }
    }

    .anim-bob {
      animation: comicBob 3.2s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .anim-bob-delay {
      animation: comicBob 3.4s ease-in-out 0.7s infinite;
      transform-origin: center bottom;
    }

    .anim-parrot {
      animation: parrotHop 2.6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-bob, .anim-bob-delay, .anim-parrot {
        animation: none !important;
      }
      * {
        transition: none !important;
      }
    }

      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const rad = Math.min(Array.isArray(r) ? r[0] : (r || 0), Math.abs(w) / 2, Math.abs(h) / 2);
        this.moveTo(x + rad, y);
        this.arcTo(x + w, y, x + w, y + h, rad);
        this.arcTo(x + w, y + h, x, y + h, rad);
        this.arcTo(x, y + h, x, y, rad);
        this.arcTo(x, y, x + w, y, rad);
        this.closePath();
        return this;
      };

        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
      } catch (_) {}
      if (state.maxUnlocked < 1) state.maxUnlocked = 1;
      document.documentElement.style.setProperty("--font-scale", String(state.fontScale || 1));
      updateFontLabel();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function resetProgress() {
      if (confirm("Möchtest du wirklich alles zurücksetzen und von vorne beginnen?")) {
        const savedScale = state.fontScale;
        localStorage.removeItem(STORAGE_KEY);
        state = {
          currentStep: 0,

          showSwissCompare: true,

          completed: {},

        };
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function markStepDone(stepIdx) {
      state.completed[stepIdx] = true;
      if (state.maxUnlocked < stepIdx + 1 && stepIdx + 1 < STEPS.length) {
        state.maxUnlocked = stepIdx + 1;
      }
      saveState();
      renderHeaderStats();
      renderStepper();
    }

    function canAccessStep(stepIdx) {
      return stepIdx === 0 || stepIdx <= state.maxUnlocked || !!state.completed[stepIdx];
    }

    function goToStep(stepIdx) {
      if (stepIdx < 0 || stepIdx >= STEPS.length) return;
      if (!canAccessStep(stepIdx)) return;
      stopSpeech();
      if (voyageAnimFrame) {
        cancelAnimationFrame(voyageAnimFrame);
        voyageAnimFrame = null;
      }
      state.currentStep = stepIdx;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =========================================================================

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRichText(raw) {
      return escapeHtml(raw).replace(/\{\{(\w+)\}\}/g, (_, key) => {
        const entry = GLOSSARY[key];
        if (!entry) return key;
        return `<button type="button" class="term-btn" onclick="openSingleTerm('${key}')">${entry.word}</button>`;
      });
    }

    function stripTokensForSpeech(raw) {
      return raw.replace(/\{\{(\w+)\}\}/g, (_, key) => GLOSSARY[key] ? GLOSSARY[key].word : key);
    }

    function updateFontLabel() {
      const el = document.getElementById("fontLabel");
      if (!el) return;
      el.textContent = state.fontScale === 1 ? "A+" : state.fontScale === 1.15 ? "A++" : "Normal";
    }

    function toggleFontSize() {
      state.fontScale = state.fontScale === 1 ? 1.15 : state.fontScale === 1.15 ? 1.3 : 1;
      document.documentElement.style.setProperty("--font-scale", String(state.fontScale));
      updateFontLabel();
      saveState();
    }

    function copyTextToClipboard(text, successMsg) {
      const showToast = (msg) => {
        const toast = document.getElementById("copy-toast");
        if (toast) toast.textContent = msg;
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          () => showToast(successMsg),
          () => fallbackCopyText(text, successMsg, showToast)
        );
      } else {
        fallbackCopyText(text, successMsg, showToast);
      }
    }

    function fallbackCopyText(text, successMsg, showToast) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successMsg);
      } catch (_) {
        alert("Kopieren fehlgeschlagen. Markiere den Text manuell:\n\n" + text);
      }
      document.body.removeChild(ta);
    }

    function renderStepper() {
      const nav = document.getElementById("stepper-nav");
      nav.innerHTML = STEPS.map((s, idx) => {
        const isActive = idx === state.currentStep;
        const isDone = !!state.completed[idx];
        const isLocked = !canAccessStep(idx);

        return `<button type="button" class="${cls}" ${isLocked ? "disabled" : ""} onclick="goToStep(${idx})">${mark}${s.label}</button>`;
      }).join("");
    }

    function animateSpanishVoyage() {
      if (!state.showRoutes) {
        state.showRoutes = true;
        saveState();
        render();
      }
      const shipC = document.getElementById("ship-cortes");
      const pathC = document.getElementById("cortes-route-path");
      const shipP = document.getElementById("ship-pizarro");
      const pathP = document.getElementById("pizarro-route-path");
      if (!shipC || !pathC || !shipP || !pathP) return;

      if (voyageAnimFrame) cancelAnimationFrame(voyageAnimFrame);
      const lenC = pathC.getTotalLength();
      const lenP = pathP.getTotalLength();
      const duration = 3400;
      const start = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const ptC = pathC.getPointAtLength(t * lenC);
        const ptP = pathP.getPointAtLength(t * lenP);
        shipC.setAttribute("transform", `translate(${ptC.x.toFixed(1)}, ${ptC.y.toFixed(1)})`);
        shipP.setAttribute("transform", `translate(${ptP.x.toFixed(1)}, ${ptP.y.toFixed(1)})`);
        if (t < 1) {
          voyageAnimFrame = requestAnimationFrame(frame);
        } else {
          voyageAnimFrame = null;
        }
      }
      voyageAnimFrame = requestAnimationFrame(frame);
    }

          <div id="task-feedback">
            ${isDone
              ? `<div class="feedback-banner ok">⭐ Super geschrieben! Deine Antwort ${task.letter} ist gespeichert und wartet gleich bei der OneNote-Abgabe.</div>`
              : (!canFinish && val.trim().length > 0
                ? `<div class="feedback-banner retry">💡 Tipp: Ergänze noch etwas mehr (mindestens 2 grüne Haken in der Checkliste oben).</div>`
                : "")}
          </div>

          <div class="nav-footer">
            <button type="button" class="btn btn-soft" onclick="goToStep(${stepIdx - 1})">
              ◀ Zurück
            </button>
            <button type="button" class="btn btn-gold" ${!isDone ? "disabled" : ""} onclick="goToStep(${stepIdx + 1})">
              ${nextLabel}
            </button>
          </div>
        </section>
      `;
    }

    function pickTaskAChoice(choice) {
      state.taskAChoice = choice;
      const starter = choice === "azteken"
        ? "Ich hätte lieber bei den Azteken gelebt, weil "
        : "Ich hätte lieber bei den Inkas gelebt, weil ";
      if (!state.taskA.trim()) {
        state.taskA = starter;
      }
      saveState();
      render();
      const ta = document.getElementById("task-textarea");
      if (ta) {
        ta.focus();
        ta.selectionStart = ta.selectionEnd = ta.value.length;
      }
    }

    function appendTaskText(stepIdx, itemIdx, isStarter) {
      const task = TASKS[stepIdx];
      const fieldKey = getTaskFieldKey(stepIdx);
      const addition = isStarter ? task.starters[itemIdx] : task.keywords[itemIdx] + " ";
      const current = state[fieldKey] || "";
      const needsSpace = current.length > 0 && !current.endsWith(" ") && !current.endsWith("\n");
      state[fieldKey] = current + (needsSpace ? " " : "") + addition;
      saveState();
      render();
      const ta = document.getElementById("task-textarea");
      if (ta) {
        ta.focus();
        ta.selectionStart = ta.selectionEnd = ta.value.length;
      }
    }

    function updateTaskText(stepIdx, val) {
      const fieldKey = getTaskFieldKey(stepIdx);
      state[fieldKey] = val;
      saveState();
      const results = evaluateTaskChecks(stepIdx, val);
      const items = document.querySelectorAll("#task-checklist .check-item");
      results.forEach((res, i) => {
        if (items[i]) {
          items[i].className = "check-item " + (res.met ? "met" : "");
          items[i].textContent = (res.met ? "✅ " : "⬜ ") + res.label;
        }
      });
    }

    function clearTaskText(stepIdx) {
      const fieldKey = getTaskFieldKey(stepIdx);
      state[fieldKey] = "";
      if (stepIdx === 7) state.taskAChoice = "";
      delete state.completed[stepIdx];
      saveState();
      render();
    }

    function completeTask(stepIdx) {
      const fieldKey = getTaskFieldKey(stepIdx);
      const val = state[fieldKey] || "";
      const results = evaluateTaskChecks(stepIdx, val);
      const metCount = results.filter(r => r.met).length;
      if (val.trim().length < 25 || metCount < 2) {
        const fb = document.getElementById("task-feedback");
        if (fb) {
          fb.innerHTML = `<div class="feedback-banner retry">💡 Bitte schreibe noch 1–2 Sätze mehr, sodass mindestens <strong>2 Punkte</strong> in der Checkliste grün werden!</div>`;
        }
        return;
      }
      markStepDone(stepIdx);
      render();
    }

    // =========================================================================
    // 15. SCHRITT 11: ONENOTE-ABGABE (KOPIEREN & PNG-EXPORT)
    // =========================================================================
    function renderSummaryScreen() {
      const entries = [
        { step: 7, letter: "A", q: TASKS[7].question, text: state.taskA },
        { step: 8, letter: "B", q: TASKS[8].question, text: state.taskB },
        { step: 9, letter: "C", q: TASKS[9].question, text: state.taskC },
        { step: 10, letter: "D", q: TASKS[10].question, text: state.taskD }
      ];

      return `
        <section class="comic-panel">
          <span class="chapter-badge" style="background:var(--emerald);">🏆 Geschafft!</span>
          <h2 class="chapter-heading font-title">Deine fertige OneNote-Abgabe</h2>

          <div class="comic-stage">
            <div class="stage-scene">
              <div class="cast-row">
                <div class="char-box">${getCharSVG("timo", "happy")}<span class="char-name-tag">Timo</span></div>
                <div class="char-box">${getCharSVG("koko", "happy")}<span class="char-name-tag">Koko</span></div>
              </div>
              <div class="dialogue-stack">
                <div class="speech-bubble timo">
                  <div class="speech-speaker"><span>Herzlichen Glückwunsch! 🎉</span></div>
                  <p class="speech-text">Du hast alle Kapitel zu den Azteken, Inkas und Spaniern gemeistert! Kopiere jetzt deine Antworten direkt in dein <strong>OneNote</strong> (oder speichere sie zusätzlich als Bild).</p>
                </div>
              </div>
            </div>
          </div>

          <div style="background:var(--gold-soft); border:2px solid var(--gold); border-radius:14px; padding:15px; margin-bottom:16px;">
            <label for="student-name-input" style="font-weight:800; display:block; margin-bottom:6px;">👤 Dein Vorname (für das optionale Abgabe-Bild):</label>
            <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
              <input id="student-name-input" class="ipad-input" style="max-width:250px;" type="text"
                placeholder="z. B. Alina" value="${escapeHtml(state.studentName)}" oninput="updateStudentName(this.value)">
              <button type="button" class="btn btn-gold" onclick="copyAllAnswers()">
                📋 Alle Antworten (A–D) kopieren
              </button>
              <button type="button" class="btn btn-emerald" onclick="downloadFullOneNoteSheet()">
                📥 Als Bild (PNG) speichern
              </button>
            </div>
            <div id="copy-toast" role="status" aria-live="polite" style="font-size:0.9rem; font-weight:800; color:var(--emerald); margin-top:8px; min-height:1.2em;"></div>
            <p style="margin:6px 0 0; font-size:0.86rem; color:var(--ink-muted);">
              <strong>Tipp fürs iPad:</strong> Tippe unten bei jeder Frage auf <strong>«Antwort kopieren»</strong> und füge den Text in OneNote direkt unter dem passenden Auftrag ein.
            </p>
          </div>

          <div class="summary-card-list">
            ${entries.map(item => `
              <article class="summary-card">
                <div class="summary-card-head">
                  <strong style="color:var(--ocean-deep); flex:1;">${item.q}</strong>
                  <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" class="btn btn-soft btn-sm" onclick="goToStep(${item.step})">✏️ Bearbeiten</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="copySingleAnswer('${item.letter}')">📋 Antwort ${item.letter} kopieren</button>
                  </div>
                </div>
                <p class="summary-answer-box">${escapeHtml(item.text || "(Noch keine Antwort)")}</p>
              </article>
            `).join("")}
          </div>

          <div class="nav-footer">
            <button type="button" class="btn btn-soft" onclick="goToStep(10)">◀ Zurück zu Auftrag D</button>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button type="button" class="btn btn-soft" onclick="goToStep(0)">🗺️ Zur Karte</button>
              <a href="index.html" class="btn btn-gold">🏠 Zur Themen-Übersicht</a>
            </div>
          </div>
        </section>
      `;
    }

    function updateStudentName(val) {
      state.studentName = val;
      saveState();
    }

    function copySingleAnswer(letter) {
      const map = { A: state.taskA, B: state.taskB, C: state.taskC, D: state.taskD };
      const txt = (map[letter] || "").trim();
      if (!txt) {
        const toast = document.getElementById("copy-toast");
        if (toast) toast.textContent = `Antwort ${letter} ist noch leer.`;
        return;
      }
      copyTextToClipboard(txt, `✅ Antwort ${letter} wurde kopiert! Jetzt in OneNote einfügen.`);
    }

    function copyAllAnswers() {
      const full = [
        "A) " + (state.taskA.trim() || "(Keine Antwort)"),
        "",
        "B) " + (state.taskB.trim() || "(Keine Antwort)"),
        "",
        "C) " + (state.taskC.trim() || "(Keine Antwort)"),
        "",
        "D) " + (state.taskD.trim() || "(Keine Antwort)")
      ].join("\n");
      copyTextToClipboard(full, "✅ Alle Antworten A–D wurden kopiert! Jetzt in OneNote einfügen.");
    }

    function measureWrappedLines(ctx, text, maxWidth) {
      const paragraphs = (text || "(Keine Antwort)").split(/\r?\n/);
      const lines = [];
      for (const para of paragraphs) {
        const words = para.split(/\s+/).filter(Boolean);
        if (!words.length) {
          lines.push("");
          continue;
        }
        let line = "";
        for (const w of words) {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = w;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
      }
      return lines.length ? lines : ["(Keine Antwort)"];
    }

    function downloadFullOneNoteSheet() {
      const W = 1200;
      const padX = 40;
      const cardW = W - padX * 2;
      const textMaxW = cardW - 48;
      const lineH = 30;

      const measureCanvas = document.createElement("canvas");
      const mctx = measureCanvas.getContext("2d");
      mctx.font = "20px Verdana, sans-serif";

      const items = [
        { letter: "A", heading: "A) Wo würdest du lieber gelebt haben: Bei den Azteken oder den Inkas? Warum?", text: state.taskA.trim() },
        { letter: "B", heading: "B) Warum konnten Hernán Cortés und Francisco Pizarro die Einheimischen im Kampf besiegen?", text: state.taskB.trim() },
        { letter: "C", heading: "C) Bewerte wie sich die Spanier gegenüber den einheimischen Azteken und Inkas verhalten haben.", text: state.taskC.trim() },
        { letter: "D", heading: "D) Warum starben in Mittel- und Südamerika im 16. Jahrhundert über 60 Millionen Menschen?", text: state.taskD.trim() }
      ];

      let totalH = 140;
      for (const it of items) {
        mctx.font = "bold 20px Verdana, sans-serif";
        it.headLines = measureWrappedLines(mctx, it.heading, textMaxW);
        mctx.font = "20px Verdana, sans-serif";
        it.bodyLines = measureWrappedLines(mctx, it.text || "(Keine Antwort)", textMaxW);
        it.cardH = 26 + it.headLines.length * 26 + 14 + it.bodyLines.length * lineH + 22;
        totalH += it.cardH + 22;
      }
      totalH += 24;

      const sheet = document.createElement("canvas");
      sheet.width = W;
      sheet.height = totalH;
      const ctx = sheet.getContext("2d");

      ctx.fillStyle = "#FBF4E4";
      ctx.fillRect(0, 0, W, totalH);

      ctx.fillStyle = "#15324D";
      ctx.fillRect(0, 0, W, 108);
      ctx.fillStyle = "#F4C552";
      ctx.fillRect(0, 104, W, 6);

      ctx.fillStyle = "#FFFDF8";
      ctx.font = "bold 30px Verdana, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Entdeckungen: Azteken, Inkas & die Spanier", 40, 50);

      ctx.fillStyle = "#FDF1CE";
      ctx.font = "20px Verdana, sans-serif";
      const nameTxt = state.studentName.trim() ? "Name: " + state.studentName.trim() : "1. Sekundarschule Niveau BC";
      ctx.fillText(nameTxt + "  •  OneNote-Abgabe (Aufträge A–D)", 40, 84);

      let curY = 136;
      for (const it of items) {
        ctx.fillStyle = "#FFFDF8";
        ctx.strokeStyle = "#2A2018";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(padX, curY, cardW, it.cardH, 18);
        ctx.fill();
        ctx.stroke();

        let textY = curY + 34;
        ctx.fillStyle = "#B8402C";
        ctx.font = "bold 20px Verdana, sans-serif";
        for (const hl of it.headLines) {
          ctx.fillText(hl, padX + 24, textY);
          textY += 26;
        }

        textY += 12;
        ctx.fillStyle = "#221A14";
        ctx.font = "20px Verdana, sans-serif";
        for (const bl of it.bodyLines) {
          ctx.fillText(bl, padX + 24, textY);
          textY += lineH;
        }

        curY += it.cardH + 22;
      }

      const a = document.createElement("a");
      a.href = sheet.toDataURL("image/png");
      a.download = "Entdeckungen_Azteken_Inkas_OneNote.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // =========================================================================
    // 16. GLOSSAR-DIALOG
    // =========================================================================
    const glossaryDialog = document.getElementById("glossary-dialog");
    const glossTitle = document.getElementById("gloss-title");
    const glossBody = document.getElementById("gloss-body");

    function openSingleTerm(key) {
      const item = GLOSSARY[key];
      if (!item) return;
      glossTitle.textContent = `📖 Begriff: ${item.word}`;
      glossBody.innerHTML = `
        <div style="font-size:0.9rem; font-weight:800; color:var(--spice-red); margin-bottom:4px;">${item.short}</div>
        <p style="font-size:1.08rem; margin:0 0 14px 0;">${item.text}</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between;">
          <button type="button" class="btn-speak" data-speech="${escapeHtml(item.word + ": " + item.text)}" onclick="speakFromBtn(this)">
            🔊 Erklärung vorlesen
          </button>
          <button type="button" class="btn btn-soft btn-sm" onclick="openGlossaryModal()">
            Alle Wörter ansehen
          </button>
        </div>
      `;
      if (!glossaryDialog.open) glossaryDialog.showModal();
    }

    function openGlossaryModal() {
      glossTitle.textContent = "📖 Alle wichtigen Wörter";
      glossBody.innerHTML = Object.values(GLOSSARY).map(item => `
        <div style="border-bottom:1.5px solid rgba(42,32,24,0.18); padding:10px 0;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong style="font-size:1.05rem;">${item.word}</strong>
            <button type="button" class="btn-speak" style="min-height:34px; padding:4px 10px;" data-speech="${escapeHtml(item.word + ": " + item.text)}" onclick="speakFromBtn(this)">🔊</button>
          </div>
          <div style="font-size:0.85rem; color:var(--spice-red); font-weight:700;">${item.short}</div>
          <p style="margin:4px 0 0 0; font-size:0.95rem;">${item.text}</p>
        </div>
      `).join("");
      if (!glossaryDialog.open) glossaryDialog.showModal();
    }

    function closeGlossary() {
      stopSpeech();
      if (glossaryDialog.open) glossaryDialog.close();
    }

    glossaryDialog.addEventListener("click", e => {
      if (e.target === glossaryDialog) closeGlossary();
    });

    document.getElementById("source-dialog").addEventListener("click", e => {
      if (e.target === document.getElementById("source-dialog")) closeSourceModal();
    });

    // =========================================================================
    // 17. VORLESEFUNKTION (WEB SPEECH API)
    // =========================================================================
    let cachedVoice = null;

    function pickGermanVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      return (
        voices.find(v => v.lang.toLowerCase().startsWith("de-ch")) ||
        voices.find(v => v.lang.toLowerCase().startsWith("de")) ||
        null
      );
    }

    if ("speechSynthesis" in window) {
      cachedVoice = pickGermanVoice();
      window.speechSynthesis.onvoiceschanged = () => {
        cachedVoice = pickGermanVoice();
      };
    }

    function clearSpeechUI() {
      document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
      if (activeSpeakBtn) {
        activeSpeakBtn.classList.remove("speaking-active");
        if (activeSpeakBtn.dataset.origLabel) {
          activeSpeakBtn.textContent = activeSpeakBtn.dataset.origLabel;
        }
      }
      activeSpeakBtn = null;
      const globalBtn = document.getElementById("global-speak-btn");
      const globalLabel = document.getElementById("speak-label");
      if (globalBtn) globalBtn.classList.remove("speaking-active");
      if (globalLabel) globalLabel.textContent = "Vorlesen";
    }

    function stopSpeech() {
      readingSequenceCancelled = true;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      clearSpeechUI();
    }

    function speakText(text, btnEl = null, highlightEl = null) {
      if (!("speechSynthesis" in window)) {
        alert("Dein Browser unterstützt leider keine Sprachausgabe.");
        return;
      }
      const isSameBtn = btnEl && activeSpeakBtn === btnEl && window.speechSynthesis.speaking;
      stopSpeech();
      if (isSameBtn) return;

      readingSequenceCancelled = false;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "de-CH";
      utter.rate = 0.92;
      if (cachedVoice) utter.voice = cachedVoice;

      if (highlightEl) highlightEl.classList.add("speaking");
      if (btnEl) {
        btnEl.dataset.origLabel = btnEl.textContent.trim();
        btnEl.classList.add("speaking-active");
        btnEl.textContent = "⏹ Stopp";
        activeSpeakBtn = btnEl;
      }

      utter.onend = clearSpeechUI;
      utter.onerror = clearSpeechUI;
      window.speechSynthesis.speak(utter);
    }

    function speakFromBtn(btnEl) {
      speakText(btnEl.dataset.speech || "", btnEl);
    }

    function speakPanel(chId, panelIdx, btnEl) {
      const ch = STORY_CHAPTERS[chId];
      if (!ch || !ch.panels[panelIdx]) return;
      const box = document.getElementById(`panel-${panelIdx}`);
      const text = stripTokensForSpeech(ch.panels[panelIdx].text);
      speakText(text, btnEl, box);
    }

    function speakCurrentSection() {
      if (!("speechSynthesis" in window)) {
        alert("Dein Browser unterstützt leider keine Sprachausgabe.");
        return;
      }
      const globalBtn = document.getElementById("global-speak-btn");
      const globalLabel = document.getElementById("speak-label");
      if (window.speechSynthesis.speaking && !readingSequenceCancelled && globalBtn.classList.contains("speaking-active")) {
        stopSpeech();
        return;
      }

      stopSpeech();

      if (state.currentStep === 0) {
        const st = MAP_STATIONS.find(s => s.id === state.selectedPin) || MAP_STATIONS[0];
        speakText(`Übersichtskarte zu Azteken, Inkas und den Spaniern. ${st.title}. ${st.desc}`);
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      if (state.currentStep >= 7 && state.currentStep <= 10) {
        const t = TASKS[state.currentStep];
        speakText(`${t.question} Tipp von Koko: ${t.kokoTip}`);
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      if (state.currentStep === 11) {
        speakText("Geschafft! Hier ist deine fertige OneNote-Abgabe. Du kannst jede Antwort einzeln kopieren und in dein OneNote einfügen oder ein Bild speichern.");
        globalBtn.classList.add("speaking-active");
        globalLabel.textContent = "Stopp";
        return;
      }

      const ch = STORY_CHAPTERS[state.currentStep];
      if (!ch) return;

      readingSequenceCancelled = false;
      globalBtn.classList.add("speaking-active");
      globalLabel.textContent = "Stopp";

      let idx = 0;
      function nextPanel() {
        if (readingSequenceCancelled || idx >= ch.panels.length) {
          clearSpeechUI();
          return;
        }
        const panel = ch.panels[idx];
        const box = document.getElementById(`panel-${idx}`);
        document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
        if (box) box.classList.add("speaking");

        const utter = new SpeechSynthesisUtterance(stripTokensForSpeech(panel.text));
        utter.lang = "de-CH";
        utter.rate = 0.92;
        if (cachedVoice) utter.voice = cachedVoice;

        utter.onend = () => {
          idx++;
          nextPanel();
        };
        utter.onerror = clearSpeechUI;
        window.speechSynthesis.speak(utter);
      }

      nextPanel();
    }

    // =========================================================================
    // 18. HAUPT-RENDER
    // =========================================================================
    function render() {
      renderHeaderStats();
      renderStepper();
      const main = document.getElementById("app-main");
      const step = state.currentStep;

      if (step === 0) {
        main.innerHTML = renderOverviewScreen();
      } else if (step >= 1 && step <= 6) {
        main.innerHTML = renderStoryChapter(step);
      } else if (step >= 7 && step <= 10) {
        main.innerHTML = renderTaskScreen(step);
      } else {
        state.completed[11] = true;
        saveState();
        renderStepper();
        main.innerHTML = renderSummaryScreen();
      }
    }

    loadState();
    render();
  </script>
</body>
